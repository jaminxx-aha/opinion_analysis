<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舆情分析报告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f4f6f9; --surface: #ffffff; --border: #e4e8ed;
  --text: #1f2937; --text-secondary: #6b7280; --text-muted: #9ca3af;
  --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #eff6ff; --primary-glow: rgba(59,130,246,.12);
  --green: #10b981; --green-bg: #ecfdf5;
  --orange: #f59e0b; --orange-bg: #fffbeb;
  --red: #ef4444; --red-bg: #fef2f2;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04);
  --radius: 10px; --radius-sm: 6px;
  --transition: .18s ease;
}
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1500px; margin: 24px auto; padding: 0 24px; }

/* ─── header ─── */
.hdr { padding: 24px 28px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 60%, #1d4ed8 100%); border-radius: var(--radius); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; box-shadow: var(--shadow-lg); }
.hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px; color: #fff; }
.hdr-meta { font-size: 13px; color: rgba(255,255,255,.85); display: flex; gap: 16px; align-items: center; }
.hdr-meta a { color: rgba(255,255,255,.9); text-decoration: none; transition: color var(--transition); }
.hdr-meta a:hover { color: #fff; text-decoration: underline; }

/* ─── summary ─── */
.summary { display: flex; gap: 0; margin-bottom: 0; background: var(--surface); overflow: hidden; }
.sum-item { flex: 1; padding: 16px 20px; text-align: center; cursor: pointer; transition: background var(--transition); }
.sum-item:hover { background: var(--primary-light); }
.sum-item + .sum-item { border-left: 1px solid var(--border); }
.sum-num { font-size: 28px; font-weight: 800; line-height: 1.1; }
.sum-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; letter-spacing: .3px; font-weight: 700; }
.sum-item.total .sum-num { color: var(--text); }
.sum-item.ok .sum-num { color: var(--green); }
.sum-item.warn .sum-num { color: var(--orange); }
.sum-item.err .sum-num { color: var(--red); }
.sum-item.long .sum-num { color: #8b5cf6; }

/* ─── toolbar ─── */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--primary-light); border-bottom: 1px solid rgba(59,130,246,.15); flex-wrap: wrap; }
.tb-label { font-size: 11px; color: var(--primary-hover); font-weight: 700; white-space: nowrap; letter-spacing: .3px; }
.tb-select { font-size: 13px; padding: 5px 26px 5px 8px; border: 1px solid rgba(59,130,246,.2); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: all var(--transition); }
.tb-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.tb-select:disabled { opacity: .45; cursor: default; }
.tb-search { margin-left: auto; }
.tb-search input { font-size: 13px; padding: 6px 12px; border: 1px solid rgba(59,130,246,.2); border-radius: var(--radius-sm); width: 160px; transition: all .2s; background: var(--surface); }
.tb-search input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); width: 220px; }
.tb-path { font-size: 13px; color: var(--text-secondary); flex-basis: 100%; }
.tb-path .p { color: var(--primary); cursor: pointer; transition: color var(--transition); }
.tb-path .p:hover { color: var(--primary-hover); text-decoration: underline; }
.tb-path .sep { color: var(--text-muted); margin: 0 4px; }
#filter-levels { display: contents; }

/* ─── charts ─── */
.charts-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow); }
/* ─── view tabs ─── */
.view-tabs { display: flex; gap: 6px; margin-bottom: 14px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: fit-content; box-shadow: var(--shadow); }
.view-tab { padding: 7px 18px; font-size: 13px; font-weight: 600; color: var(--text-secondary); border-radius: 6px; cursor: pointer; transition: all var(--transition); user-select: none; }
.view-tab:hover:not(.active) { background: var(--primary-light); color: var(--primary); }
.view-tab.active { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.charts-hdr { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--border); }
.charts-hdr h2 { font-size: 15px; font-weight: 700; }
.charts-hdr .tog { font-size: 13px; color: var(--primary); cursor: pointer; transition: color var(--transition); }
.charts-hdr .tog:hover { color: var(--primary-hover); }
.charts-body { padding: 24px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.charts-body.hide { display: none; }
.ch-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.ch-wrap { height: 300px; position: relative; }

/* ─── table ─── */
.tbl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.tbl-hdr { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.tbl-hdr h2 { font-size: 15px; font-weight: 700; }
.tbl-hdr .cnt { font-size: 12px; color: var(--text-secondary); }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl col:nth-child(1) { width: 36px; }
.tbl col:nth-child(2) { width: 80px; }
.tbl col:nth-child(3) { width: 30%; }
.tbl col:nth-child(4) { width: 20%; }
.tbl col:nth-child(5) { width: auto; }
.tbl th { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-align: left; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
.tbl td { font-size: 13px; padding: 9px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; transition: background var(--transition); }
.tbl td:first-child { text-align: left; }
.tbl th:first-child { text-align: left; padding: 10px 4px 10px 20px; }
.tbl tbody tr:hover { background: var(--primary-light); }
.tbl tbody tr:last-child td { border-bottom: none; }

/* table content helpers */
.prob { color: var(--primary); cursor: pointer; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; transition: color var(--transition); }
.prob:hover { color: var(--primary-hover); text-decoration: underline; }
.cls { font-size: 13px; }
.cls .c { color: var(--primary); cursor: pointer; font-weight: 600; transition: color var(--transition); }
.cls .c:hover { color: var(--primary-hover); text-decoration: underline; }
.cls .dot { color: var(--text-muted); margin: 0 2px; }
.cls .unk { color: var(--orange); cursor: pointer; font-weight: 600; transition: color var(--transition); }
.cls .unk:hover { text-decoration: underline; }
.cls .fail { color: var(--red); cursor: pointer; font-weight: 600; transition: color var(--transition); }
.cls .fail:hover { text-decoration: underline; }
.cls .long { color: #8b5cf6; cursor: pointer; font-weight: 600; transition: color var(--transition); }
.cls .long:hover { text-decoration: underline; }
.rsn { font-size: 12px; color: var(--text-secondary); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; cursor: default; }

/* ─── pagination ─── */
.pgn { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pgn button { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
.pgn button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.pgn button:disabled { opacity: .35; cursor: default; }
.pgn button.act { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 4px rgba(59,130,246,.25); }
.pgn .info { font-size: 12px; color: var(--text-muted); }

/* ─── empty ─── */
.empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px; }
.empty.hidden { display: none; }

/* ─── modal ─── */
.mdl-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(2px); }
.mdl-bg.hidden { display: none; }
.mdl { background: var(--surface); border-radius: var(--radius); width: 760px; max-width: 90vw; max-height: 80vh; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,.2); }
.mdl-top { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.mdl-top h3 { font-size: 15px; font-weight: 700; }
.mdl-x { font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); transition: all var(--transition); }
.mdl-x:hover { background: var(--red-bg); color: var(--red); }
.mdl-in { padding: 24px; overflow-y: auto; max-height: calc(80vh - 52px); }
.mdl-cls { padding: 16px 20px; background: var(--primary-light); border-radius: var(--radius-sm); margin-bottom: 16px; }
.mdl-cls .l { font-size: 11px; color: var(--text-secondary); font-weight: 700; letter-spacing: .3px; }
.mdl-cls .v { font-size: 15px; color: var(--primary); font-weight: 700; margin-top: 2px; }
.mdl-rsn { padding: 16px 20px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.mdl-rsn .l { font-size: 11px; color: var(--text-secondary); font-weight: 700; margin-bottom: 4px; letter-spacing: .3px; }
.mdl-tbl { width: 100%; border-collapse: collapse; }
.mdl-tbl th { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-align: left; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); }
.mdl-tbl td { font-size: 13px; padding: 8px 12px; border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <h1>📋 舆情分析报告</h1>
  <div class="hdr-meta">
    <span>{{GENERATED_TIME}}</span>
    {{IF_EXCEL_FILENAME}}<a href="{{EXCEL_FILENAME}}" download>⬇ 下载原始数据</a>{{ENDIF_EXCEL_FILENAME}}
  </div>
</div>

<div class="view-tabs" id="view-tabs"></div>

<div class="charts-card">
  <div class="summary">
    <div class="sum-item total" onclick="filterByStatus('all')"><div class="sum-num" id="sum-total">{{TOTAL}}</div><div class="sum-label">总数据</div></div>
    <div class="sum-item ok" onclick="filterByStatus('classified')"><div class="sum-num" id="sum-classified">{{CLASSIFIED}}</div><div class="sum-label">已分类</div></div>
    <div class="sum-item warn" onclick="filterByStatus('unknown_issue')"><div class="sum-num" id="sum-unknown">{{UNKNOWN_ISSUE}}</div><div class="sum-label">未知问题</div></div>
    <div class="sum-item err" onclick="filterByStatus('infer_failed')"><div class="sum-num" id="sum-failed">{{INFER_FAILED}}</div><div class="sum-label">失败</div></div>
    <div class="sum-item long" onclick="filterByStatus('too_long')"><div class="sum-num" id="sum-long">{{TOO_LONG}}</div><div class="sum-label">描述过长</div></div>
  </div>

  <div class="toolbar" id="toolbar">
    <span id="filter-levels"></span>
    <span class="tb-label">版本</span><select class="tb-select" id="filter-version" onchange="onVersionChange()" disabled><option value="">全部</option></select>
    <div class="tb-search"><input type="text" id="search-input" placeholder="搜索..." onkeyup="onSearch()"></div>
    <span id="filter-path" class="tb-path"></span>
  </div>

  <div class="charts-hdr">
    <h2>📊 数据分布</h2>
    <span class="tog" onclick="toggleCharts()">收起</span>
  </div>
  <div class="charts-body" id="charts-body">
    <div><div class="ch-sub" id="bar-title">分布</div><div class="ch-wrap"><canvas id="barChart"></canvas></div></div>
    <div><div class="ch-sub" id="pie-title">分布</div><div class="ch-wrap"><canvas id="pieChart"></canvas></div></div>
  </div>
</div>

<div class="tbl-card">
  <div class="tbl-hdr"><h2>📑 详细数据</h2><span class="cnt" id="table-count">0 条</span></div>
  <div class="tbl-scroll">
    <table class="tbl">
      <colgroup><col><col><col><col><col></colgroup>
      <thead><tr><th>序号</th><th>版本号</th><th>问题描述</th><th>分类</th><th>推理说明</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div class="pgn" id="pagination"></div>
  <div class="empty hidden" id="empty-state">没有找到匹配的数据</div>
</div>

<div class="mdl-bg hidden" id="modal-overlay" onclick="closeModal()">
  <div class="mdl" onclick="event.stopPropagation()">
    <div class="mdl-top"><h3>数据详情</h3><span class="mdl-x" onclick="closeModal()">✕</span></div>
    <div class="mdl-in" id="modal-body"></div>
  </div>
</div>

</div>

<script id="report-data" type="application/json">{{DATA_JSON}}</script>
<script>
// 单数据源：{summary, details}。功能域用 full_path 多级、业务域用 business_classification 单层，视图切换。
const SEP = "-";
const LEAF = "（无下级）";  // 叶子节点（无更细子级）在图表/筛选中的占位标签
let rawData = (() => {
  const el = document.getElementById('report-data');
  if (!el || !el.textContent.trim()) return { summary: {}, details: [] };
  try { return JSON.parse(el.textContent); } catch (e) { return { summary: {}, details: [] }; }
})();
let allData = rawData.details || [];
let summary = rawData.summary || {};

let activeView = "function";   // function | business
let maxDepth = 1;              // 功能域 full_path 最大深度，决定级联筛选级数
let funcFilters = [];          // 长度 maxDepth，每级选中的值（""=全部）
let bizFilter = "";            // 业务域单层筛选
let depthFilter = "";          // 功能域「仅N级」
let searchText = "";
let versionFilter = "";
let statusFilter = "";
let charts = {};
let chartsVisible = true;
let currentPage = 1;
const pageSize = 50;

// ─── 工具：取 item 的功能域 levels 数组 / 业务标签 ───
function levelsOf(item) {
  const cls = item.classification || {};
  if (!cls || !cls.full_path) return [];
  return cls.full_path.split(SEP).filter(Boolean);
}
function bizOf(item) {
  const cls = item.classification || {};
  return (cls && cls.business_classification) || "";
}
function computeMaxDepth() {
  let d = 1;
  allData.forEach(item => { if (item.status === "classified") { const n = levelsOf(item).length; if (n > d) d = n; } });
  return d;
}

// ─── 选项计算 ───
// 功能域：给定深度 depth(1-based) 与前缀选中数组 prefixSel，返回该深度可选值
function getAvailableLevels(depth, prefixSel) {
  const s = {};
  allData.forEach(item => {
    if (item.status !== "classified") return;
    const lv = levelsOf(item);
    if (lv.length < depth) return;
    // 前缀必须匹配
    for (let i = 0; i < depth - 1; i++) {
      if (prefixSel[i] && lv[i] !== prefixSel[i]) return;
    }
    s[lv[depth - 1]] = true;
  });
  return Object.keys(s).sort();
}
// 业务域：可选页面标签
function getAvailableBiz() {
  const s = {};
  allData.forEach(item => { if (item.status === "classified") { const b = bizOf(item); if (b) s[b] = true; } });
  return Object.keys(s).sort();
}
function getAllVersions() {
  const versions = {}; let hasEmpty = false;
  allData.forEach(item => { if (item.version) versions[item.version] = true; else hasEmpty = true; });
  const list = Object.keys(versions).sort();
  if (hasEmpty) list.push("");
  return list;
}

function fillSelect(sel, options, value) {
  const cur = value != null ? value : sel.value;
  sel.innerHTML = '<option value="" title="全部">全部</option>';
  options.forEach(o => {
    const e = document.createElement("option");
    if (sel.id === "filter-version" && o === "") { e.value = "__empty__"; e.textContent = "无版本号"; e.title = "无版本号"; }
    else { e.value = o; e.textContent = o; e.title = o; }
    sel.appendChild(e);
  });
  sel.value = options.includes(cur) ? cur : "";
  updateSelectTitle(sel);
}
function updateSelectTitle(sel) { sel.title = sel.selectedIndex >= 0 && sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].title : ''; }
function updateAllSelectTitles() { document.querySelectorAll('.tb-select').forEach(sel => updateSelectTitle(sel)); }

// ─── 渲染级联筛选控件（功能域 N 级 / 业务域 1 级）───
function renderFilterControls() {
  const container = document.getElementById("filter-levels");
  container.innerHTML = "";
  if (activeView === "function") {
    // 深度选择
    const depthWrap = document.createElement("span");
    depthWrap.innerHTML = '<span class="tb-label">层级</span>';
    const depthSel = document.createElement("select");
    depthSel.className = "tb-select"; depthSel.id = "filter-depth";
    depthSel.onchange = () => { depthFilter = depthSel.value; currentPage = 1; updateAll(); };
    let dhtml = '<option value="">全部</option>';
    for (let i = 1; i <= maxDepth; i++) dhtml += `<option value="${i}">仅${CN_NUM[i]}级</option>`;
    depthSel.innerHTML = dhtml; depthSel.value = depthFilter;
    depthWrap.appendChild(depthSel);
    container.appendChild(depthWrap);
    // 每级级联
    for (let d = 1; d <= maxDepth; d++) {
      const w = document.createElement("span");
      const lbl = document.createElement("span"); lbl.className = "tb-label"; lbl.textContent = `${CN_NUM[d]}级`;
      const sel = document.createElement("select");
      sel.className = "tb-select"; sel.id = `filter-level${d}`;
      sel.onchange = () => onFuncLevelChange(d);
      const prefix = funcFilters.slice(0, d - 1);
      const opts = getAvailableLevels(d, prefix);
      fillSelect(sel, opts, funcFilters[d - 1] || "");
      sel.disabled = opts.length === 0;
      w.appendChild(lbl); w.appendChild(sel);
      container.appendChild(w);
    }
  } else {
    // 业务域单层
    const w = document.createElement("span");
    const lbl = document.createElement("span"); lbl.className = "tb-label"; lbl.textContent = "业务页";
    const sel = document.createElement("select");
    sel.className = "tb-select"; sel.id = "filter-biz";
    sel.onchange = () => { bizFilter = sel.value; currentPage = 1; updateAll(); };
    fillSelect(sel, getAvailableBiz(), bizFilter);
    w.appendChild(lbl); w.appendChild(sel);
    container.appendChild(w);
  }
  // 版本下拉
  const verSel = document.getElementById("filter-version");
  fillSelect(verSel, getAllVersions(), versionFilter);
  verSel.disabled = getAllVersions().length === 0;
  updateAllSelectTitles();
}

const CN_NUM = ["", "一", "二", "三", "四", "五", "六", "七", "八"];

function onFuncLevelChange(d) {
  const sel = document.getElementById(`filter-level${d}`);
  funcFilters[d - 1] = sel.value;
  // 清空下级并重填
  for (let i = d; i < maxDepth; i++) funcFilters[i] = "";
  // 重填 d+1..maxDepth
  for (let nd = d + 1; nd <= maxDepth; nd++) {
    const nsel = document.getElementById(`filter-level${nd}`);
    if (nsel) { const opts = getAvailableLevels(nd, funcFilters.slice(0, nd - 1)); fillSelect(nsel, opts, ""); nsel.disabled = opts.length === 0; }
  }
  currentPage = 1; updateAll();
}

// ─── 过滤 ───
function getFilteredData() {
  return allData.filter(item => {
    if (versionFilter) { const fv = versionFilter === "__empty__" ? "" : versionFilter; if (item.version !== fv) return false; }
    if (statusFilter && item.status !== statusFilter && !(statusFilter === "classified" && item.status === "classified")) return false;
    // 非分类态：功能域/业务域筛选不命中则排除
    if (item.status === "infer_failed" || item.status === "too_long" || item.status === "unknown_issue" || item.status === "pending") {
      if (activeView === "function" && (depthFilter || funcFilters.some(f => f))) return false;
      if (activeView === "business" && bizFilter) return false;
      if (searchText && !(item.input || "").toLowerCase().includes(searchText.toLowerCase())) return false;
      return true;
    }
    if (item.status === "classified") {
      if (activeView === "function") {
        const lv = levelsOf(item);
        if (depthFilter && lv.length !== parseInt(depthFilter)) return false;
        for (let i = 0; i < maxDepth; i++) {
          const f = funcFilters[i];
          if (!f) continue;
          if (f === LEAF) { if (lv.length !== i) return false; }       // 仅留停在本级的叶子
          else if (lv[i] !== f) return false;
        }
      } else {
        if (bizFilter && bizOf(item) !== bizFilter) return false;
      }
    }
    if (searchText && !(item.input || "").toLowerCase().includes(searchText.toLowerCase())) return false;
    return true;
  });
}

// ─── 统计（图表）───
// 功能域：展示当前已钻取路径(drilledTo)的「下一级子分类」分布，并额外把「正好停在本级
//   （无更细子级）」的条目作为单独 bar 展示——其显示名用该分类本身(=父级名)，内部 key 用
//   LEAF 哨兵以与同名子级区分。该叶子 bar 置于最前且不可点击。标题用实际父级名（根=全部）。
function calcStats() {
  const data = getFilteredData();
  if (activeView === "business") {
    const c = {};
    data.forEach(item => { if (item.status === "classified") { const b = bizOf(item); if (b) c[b] = (c[b] || 0) + 1; } });
    const labels = Object.keys(c), values = Object.values(c);
    return { title: bizFilter || "业务页面分布", labels, keys: labels, values };
  }
  // drilledTo = 已选中的最深层级(1-based，跳过 LEAF)，0 表示未钻取
  let drilledTo = 0;
  for (let i = 0; i < maxDepth; i++) if (funcFilters[i] && funcFilters[i] !== LEAF) drilledTo = i + 1;
  const parentName = drilledTo > 0 ? funcFilters[drilledTo - 1] : "全部";
  const childC = {};
  let leafN = 0;
  data.forEach(item => {
    if (item.status !== "classified") return;
    const lv = levelsOf(item);
    let ok = true;
    for (let i = 0; i < drilledTo; i++) { if (funcFilters[i] && lv[i] !== funcFilters[i]) { ok = false; break; } }
    if (!ok) return;
    if (lv.length > drilledTo) { const seg = lv[drilledTo]; childC[seg] = (childC[seg] || 0) + 1; }
    else if (lv.length === drilledTo) leafN++;
  });
  const labels = [], keys = [], values = [];
  if (leafN > 0) { labels.push(parentName); keys.push(LEAF); values.push(leafN); }  // 叶子 bar 置最前
  for (const k in childC) { labels.push(k); keys.push(k); values.push(childC[k]); }
  return { title: parentName, labels, keys, values };
}

function updateCharts() {
  const stats = calcStats();
  let labels = stats.labels.slice(), values = stats.values.slice();
  if (labels.length === 0) { labels = ["无数据"]; values = [0]; }
  document.getElementById("bar-title").textContent = stats.title;
  document.getElementById("pie-title").textContent = stats.title;
  charts.bar.data.labels = labels; charts.bar.data.datasets[0].data = values;
  charts.pie.data.labels = labels; charts.pie.data.datasets[0].data = values;
  charts.bar.update(); charts.pie.update();
}

// 图表点击：点击的 bar 属于「当前钻取路径下一级」(索引 drilledTo)。
//   子级 bar → 钻入该子级；叶子 bar(显示父级名,内部key=LEAF) → 表格筛到「正好停在本级」的条目；
//   再次点击同一 bar 则取消选中。
function chartDrillDown(chart, els) {
  if (!els.length) return;
  const idx = els[0].index;
  const v = chart.data.labels[idx];
  if (v == null || v === "" || v === "无数据") return;
  if (activeView === "business") { bizFilter = (bizFilter === v) ? "" : v; currentPage = 1; renderFilterControls(); updateAll(); return; }
  const stats = calcStats();
  const key = stats.keys[idx];
  if (key == null || key === LEAF) return;   // 叶子 bar（无下级）不可点击选择
  let drilledTo = 0;
  for (let i = 0; i < maxDepth; i++) if (funcFilters[i] && funcFilters[i] !== LEAF) drilledTo = i + 1;
  if (drilledTo >= maxDepth) return;          // 已到最深层，无更细子级
  const cur = funcFilters[drilledTo];
  funcFilters[drilledTo] = (cur === key) ? "" : key;
  for (let i = drilledTo + 1; i < maxDepth; i++) funcFilters[i] = "";
  currentPage = 1; renderFilterControls(); updateAll();
}

const COLORS = ["#3b82f6","#8b5cf6","#ef4444","#10b981","#f59e0b","#0ea5e9","#14b8a6","#f97316","#1f2937","#d97706","#06b6d4","#dc2626","#6b7280","#1d4ed8","#a855f7","#334155"];

function initCharts() {
  const stats = calcStats();
  let labels = stats.labels.slice(), values = stats.values.slice();
  if (labels.length === 0) { labels = ["无数据"]; values = [0]; }
  charts.bar = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: "#1f2937", cornerRadius: 6, padding: 10, titleFont: { size: 13, weight: 700 }, bodyFont: { size: 12 } } }, scales: { y: { beginAtZero: true, grid: { color: "#f0f0f0" }, ticks: { font: { size: 11 } } }, x: { grid: { display: false }, ticks: { font: { size: 11 } } } }, onClick: (_, els) => chartDrillDown(charts.bar, els) }
  });
  charts.pie = new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 2, borderColor: "#fff" }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: "40%", plugins: { legend: { position: "right", labels: { padding: 10, usePointStyle: true, pointStyle: "circle", font: { size: 11 } } }, tooltip: { backgroundColor: "#1f2937", cornerRadius: 6, padding: 10, titleFont: { size: 13, weight: 700 }, bodyFont: { size: 12 }, callbacks: { label: ctx => { const t = ctx.dataset.data.reduce((a,b)=>a+b,0); return ctx.label + ": " + ctx.raw + "条 (" + (t ? Math.round(ctx.raw/t*100) : 0) + "%)"; } } } }, onClick: (_, els) => chartDrillDown(charts.pie, els) }
  });
}

// ─── 表格 ───
function clsHtmlFor(item) {
  if (item.status === "infer_failed") return "<span class='cls'><span class='fail' onclick=\"setStatusFilter('infer_failed')\">推理失败</span></span>";
  if (item.status === "too_long") return "<span class='cls'><span class='long' onclick=\"setStatusFilter('too_long')\">描述过长</span></span>";
  if (item.status !== "classified") return "<span class='cls'><span class='unk' onclick=\"setStatusFilter('unknown_issue')\">未知问题</span></span>";
  if (activeView === "business") {
    const b = bizOf(item) || "其它";
    return `<span class='cls'><span class='c' onclick="setBizFilter('${b}')">${b}</span></span>`;
  }
  const lv = levelsOf(item);
  const ps = lv.map((name, i) => {
    const prefix = lv.slice(0, i + 1).map(x => `'${x}'`).join(",");
    return `<span class='c' onclick="setFuncLevel(${i + 1}, [${prefix}])">${name}</span>`;
  });
  return "<span class='cls'>" + ps.join("<span class='dot'>·</span>") + "</span>";
}
function setFuncLevel(depth, prefix) {
  // prefix = 点击节点及其祖先各级名称（长度 = depth）
  funcFilters = new Array(maxDepth).fill("");
  for (let i = 0; i < depth; i++) funcFilters[i] = prefix[i] || "";
  currentPage = 1; renderFilterControls(); updateAll();
}
function setBizFilter(b) { bizFilter = b; currentPage = 1; renderFilterControls(); updateAll(); }
function setStatusFilter(s) { statusFilter = statusFilter === s ? "" : s; resetLevelFilters(); currentPage = 1; renderFilterControls(); updateAll(); }

function updateTable() {
  const tbody = document.getElementById("table-body"), empty = document.getElementById("empty-state"), cnt = document.getElementById("table-count"), pgn = document.getElementById("pagination");
  const filtered = getFilteredData();
  cnt.textContent = filtered.length + " 条";
  const totalPages = Math.ceil(filtered.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  const start = (currentPage - 1) * pageSize, pageData = filtered.slice(start, start + pageSize);
  tbody.innerHTML = "";
  if (filtered.length === 0) { empty.classList.remove("hidden"); pgn.innerHTML = ""; return; }
  empty.classList.add("hidden");
  pageData.forEach((item, i) => {
    const gi = start + i, row = document.createElement("tr");
    row.innerHTML =
      "<td>" + (gi + 1) + "</td>" +
      "<td>" + (item.version || "") + "</td>" +
      "<td><span class='prob' onclick='showDetail(" + gi + ")'>" + (item.input || "") + "</span></td>" +
      "<td>" + clsHtmlFor(item) + "</td>" +
      "<td><span class='rsn'>" + (item.reasoning || "") + "</span></td>";
    tbody.appendChild(row);
  });
  updatePagination(filtered.length, totalPages);
}

// ─── 面包屑 ───
function resetLevelFilters() {
  funcFilters = new Array(maxDepth).fill(""); bizFilter = ""; depthFilter = "";
}
function updateBreadcrumb() {
  const el = document.getElementById("filter-path");
  const hasF = activeView === "function" ? (funcFilters.some(f => f) || depthFilter) : !!bizFilter;
  if (!hasF && !searchText && !statusFilter && !versionFilter) { el.innerHTML = ""; return; }
  const ps = ["<span class='p' onclick='clearFilters()'>全部</span>"];
  if (statusFilter) ps.push("<span class='p' onclick='clearFilters()'>" + statusLabel(statusFilter) + "</span>");
  if (versionFilter) ps.push("<span class='p' onclick='clearVersion()'>版本:" + (versionFilter === "__empty__" ? "无版本号" : versionFilter) + "</span>");
  if (activeView === "function") {
    if (depthFilter) ps.push("<span class='p' onclick='clearFilters()'>仅" + (CN_NUM[parseInt(depthFilter)] || depthFilter) + "级</span>");
    funcFilters.forEach((v, i) => { if (v && v !== LEAF) ps.push("<span class='p' onclick='clearLevel(" + (i + 1) + ")'>" + v + "</span>"); });
  } else {
    if (bizFilter) ps.push("<span class='p' onclick='clearFilters()'>" + bizFilter + "</span>");
  }
  if (searchText) ps.push("<span class='p' onclick='clearFilters()'>搜索:" + searchText + "</span>");
  el.innerHTML = ps.join("<span class='sep'>›</span>");
}
function statusLabel(s) { return s === "classified" ? "已分类" : s === "unknown_issue" ? "未知问题" : s === "infer_failed" ? "推理失败" : s === "too_long" ? "描述过长" : s; }
function clearVersion() { versionFilter = ""; document.getElementById("filter-version").value = ""; currentPage = 1; updateAll(); }
function clearLevel(n) {
  if (activeView === "function") { for (let i = n - 1; i < maxDepth; i++) funcFilters[i] = ""; }
  currentPage = 1; renderFilterControls(); updateAll();
}
function clearFilters() {
  statusFilter = ""; resetLevelFilters(); searchText = ""; versionFilter = "";
  document.getElementById("search-input").value = "";
  currentPage = 1; renderFilterControls(); updateAll();
}

function onSearch() { searchText = document.getElementById("search-input").value; currentPage = 1; updateAll(); }
function onVersionChange() {
  const newVer = document.getElementById("filter-version").value;
  if (newVer !== versionFilter) { resetLevelFilters(); statusFilter = ""; }
  versionFilter = newVer; currentPage = 1; renderFilterControls(); updateAll();
}
function filterByStatus(status) {
  statusFilter = statusFilter === status ? "" : status;
  resetLevelFilters(); searchText = ""; versionFilter = "";
  document.getElementById("search-input").value = "";
  currentPage = 1; renderFilterControls(); updateAll();
}

function toggleCharts() {
  chartsVisible = !chartsVisible;
  document.getElementById("charts-body").classList.toggle("hide", !chartsVisible);
  document.querySelector(".tog").textContent = chartsVisible ? "收起" : "展开";
}

function updateAll() { updateAllSelectTitles(); updateCharts(); updateBreadcrumb(); updateTable(); }

function updatePagination(total, tp) {
  const el = document.getElementById("pagination");
  if (tp <= 1) { el.innerHTML = ""; return; }
  let h = '<button onclick="goToPage(1)"' + (currentPage===1?" disabled":"") + '>首页</button>';
  h += '<button onclick="goToPage('+(currentPage-1)+')"'+(currentPage===1?" disabled":"") + '>上一页</button>';
  const sp = Math.max(1, currentPage-2), ep = Math.min(tp, sp+4);
  for (let p=sp; p<=ep; p++) h += '<button onclick="goToPage('+p+')" class="'+(p===currentPage?"act":"")+'">'+p+'</button>';
  h += '<button onclick="goToPage('+(currentPage+1)+')"'+(currentPage===tp?" disabled":"") + '>下一页</button>';
  h += '<button onclick="goToPage('+tp+')"'+(currentPage===tp?" disabled":"") + '>末页</button>';
  h += '<span class="info">第'+currentPage+'/'+tp+'页</span>';
  el.innerHTML = h;
}
function goToPage(p) {
  const tp = Math.ceil(getFilteredData().length / pageSize);
  if (p<1) p=1; if (p>tp) p=tp; currentPage = p; updateTable();
}

function showDetail(i) {
  const item = getFilteredData()[i], cls = item.classification || {};
  let cv = "";
  if (item.status === "classified") cv = levelsOf(item).join(SEP);
  else if (item.status === "unknown_issue") cv = "未知问题";
  else if (item.status === "too_long") cv = "描述过长";
  else cv = "推理失败";
  let h = "<div class='mdl-cls'><div class='l'>功能域分类</div><div class='v'>" + cv + "</div></div>";
  if (item.status === "classified") h += "<div class='mdl-cls' style='background:#f7f9fb;margin-bottom:16px'><div class='l'>业务域分类</div><div class='v' style='color:var(--text);font-size:14px'>" + (bizOf(item) || "—") + "</div></div>";
  if (item.version) h += "<div class='mdl-cls' style='background:#f7f9fb;margin-bottom:0'><div class='l'>版本号</div><div class='v' style='color:var(--text);font-size:14px'>" + item.version + "</div></div>";
  if (item.reasoning) h += "<div class='mdl-rsn'><div class='l'>推理过程</div>" + item.reasoning + "</div>";
  const raw = item.raw_data || {};
  h += "<table class='mdl-tbl'><thead><tr><th>行号</th>";
  for (const k in raw) { if (k === "序号") continue; h += "<th>"+k+"</th>"; }
  h += "</tr></thead><tbody><tr><td>"+(item.row_id||"")+"</td>";
  for (const k in raw) { if (k === "序号") continue; h += "<td>"+raw[k]+"</td>"; }
  h += "</tr></tbody></table>";
  document.getElementById("modal-body").innerHTML = h;
  document.getElementById("modal-overlay").classList.remove("hidden");
}
function closeModal() { document.getElementById("modal-overlay").classList.add("hidden"); }

// ─── 视图切换 ───
function renderViewTabs() {
  const el = document.getElementById("view-tabs");
  el.style.display = "flex";
  const tabs = [["function", "功能域"], ["business", "业务域"]];
  el.innerHTML = tabs.map(([v, label]) =>
    `<div class="view-tab${v === activeView ? ' active' : ''}" data-view="${v}" onclick="switchView('${v}')">${label}</div>`
  ).join("");
}
function switchView(v) { if (v === activeView) return; applyView(v); }
function applyView(v) {
  activeView = v;
  resetLevelFilters(); statusFilter = ""; searchText = ""; versionFilter = ""; currentPage = 1;
  document.getElementById("search-input").value = "";
  if (charts.bar) { try { charts.bar.destroy(); charts.pie.destroy(); } catch (e) {} }
  charts = {};
  renderFilterControls();
  initCharts(); updateAll();
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
}

function updateSummary() {
  document.getElementById("sum-total").textContent = (summary.total != null ? summary.total : allData.length);
  document.getElementById("sum-classified").textContent = summary.classified || 0;
  document.getElementById("sum-unknown").textContent = summary.unknown_issue || 0;
  document.getElementById("sum-failed").textContent = summary.infer_failed || 0;
  document.getElementById("sum-long").textContent = summary.too_long || 0;
}

document.addEventListener("DOMContentLoaded", () => {
  maxDepth = computeMaxDepth();
  funcFilters = new Array(maxDepth).fill("");
  updateSummary();
  renderViewTabs();
  renderFilterControls();
  initCharts();
  updateAll();
});
</script>
