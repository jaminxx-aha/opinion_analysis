<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告管理中心</title>
<script src="chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f4f6f9; --surface: #ffffff; --border: #e4e8ed;
  --text: #1f2937; --text-secondary: #6b7280; --text-muted: #9ca3af;
  --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #eff6ff; --primary-glow: rgba(59,130,246,.12);
  --color-a: #3b82f6; --color-b: #f59e0b;
  --green: #10b981; --green-bg: #ecfdf5;
  --orange: #f59e0b; --orange-bg: #fffbeb;
  --red: #ef4444; --red-bg: #fef2f2;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04);
  --radius: 10px; --radius-sm: 6px;
  --transition: .18s ease;
}
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 24px auto; padding: 0 20px; }

/* ─── header ─── */
.hdr { padding: 24px 28px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 60%, #1d4ed8 100%); border-radius: var(--radius); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; box-shadow: var(--shadow-lg); }
.domain-tabs { display: none; gap: 6px; margin-bottom: 20px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: fit-content; box-shadow: var(--shadow); }
.domain-tab { padding: 7px 18px; font-size: 13px; font-weight: 600; color: var(--text-secondary); border-radius: 6px; cursor: pointer; transition: all .2s; user-select: none; }
.domain-tab:hover:not(.active) { background: var(--primary-light); color: var(--primary); }
.domain-tab.active { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px; color: #fff; }
.hdr-meta { font-size: 13px; color: rgba(255,255,255,.8); }

/* ─── report selector ─── */
.rpt-bar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); transition: box-shadow var(--transition); }
.rpt-bar:hover { box-shadow: var(--shadow-md); }
.rpt-bar-label { font-size: 12px; color: var(--text-secondary); font-weight: 700; white-space: nowrap; letter-spacing: .5px; }
.rpt-bar-select { font-size: 13px; padding: 6px 28px 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; width: 220px; transition: border-color var(--transition); }
.rpt-bar-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.rpt-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.rpt-detail-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.rpt-detail-date { font-size: 12px; color: var(--text-secondary); }
.rpt-detail-source { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.rpt-detail-stats { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.rpt-stat { padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.rpt-stat.total { background: var(--bg); color: var(--text); }
.rpt-stat.ok { background: var(--green-bg); color: var(--green); }
.rpt-stat.warn { background: var(--orange-bg); color: var(--orange); }
.rpt-stat.err { background: var(--red-bg); color: var(--red); }
.rpt-detail-link { display: inline-block; font-size: 13px; color: var(--primary); text-decoration: none; padding: 6px 16px; border: 1px solid var(--primary); border-radius: var(--radius-sm); margin-top: 4px; transition: all var(--transition); }
.rpt-detail-link:hover { background: var(--primary-light); box-shadow: var(--shadow-sm); }
.rpt-detail-link.disabled { opacity: .4; cursor: default; border-color: var(--border); color: var(--text-muted); }

/* ─── empty ─── */
.empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px; }

/* ─── section divider ─── */
.section { margin-bottom: 20px; }

/* ─── comparison toolbar ─── */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 0; padding: 10px 16px; background: var(--primary-light); border-bottom: 1px solid rgba(59,130,246,.15); flex-wrap: wrap; }
.tb-label { font-size: 11px; color: var(--primary-hover); font-weight: 700; white-space: nowrap; letter-spacing: .3px; }
.tb-select { font-size: 13px; padding: 5px 26px 5px 8px; border: 1px solid rgba(59,130,246,.2); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: all var(--transition); }
.tb-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.tb-select:disabled { opacity: .45; cursor: default; }
.tb-btn { font-size: 12px; padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
.tb-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 4px rgba(59,130,246,.25); }
.tb-btn:hover:not(.active) { background: var(--bg); border-color: var(--primary); color: var(--primary); }
.tb-path { font-size: 13px; color: var(--text-secondary); flex-basis: 100%; }
.tb-path .p { color: var(--primary); cursor: pointer; transition: color var(--transition); }
.tb-path .p:hover { color: var(--primary-hover); text-decoration: underline; }
.tb-path .sep { color: var(--text-muted); margin: 0 4px; }

/* ─── pagination ─── */
.pgn { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pgn button { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
.pgn button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.pgn button:disabled { opacity: .35; cursor: default; }
.pgn button.act { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 4px rgba(59,130,246,.25); }
.pgn .info { font-size: 12px; color: var(--text-muted); }

.tbl tbody tr.drillable { cursor: pointer; transition: background var(--transition); }

/* ─── charts ─── */
.charts-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.charts-hdr { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.charts-hdr h2 { font-size: 15px; font-weight: 700; }
.charts-body { padding: 24px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.ch-wrap { height: 300px; position: relative; }
.ch-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }

/* ─── comparison summary ─── */
.cmp-summary { display: flex; gap: 0; margin: 0; background: var(--surface); overflow: hidden; }
.cmp-sum-item { flex: 1; padding: 16px 20px; text-align: center; transition: background var(--transition); }
.cmp-sum-item:hover { background: var(--primary-light); }
.cmp-sum-item + .cmp-sum-item { border-left: 1px solid var(--border); }
.cmp-sum-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: .3px; font-weight: 700; }
.cmp-sum-vals { display: flex; justify-content: center; align-items: center; gap: 8px; }
.cmp-val-a { font-size: 22px; font-weight: 800; color: var(--color-a); }
.cmp-val-b { font-size: 22px; font-weight: 800; color: var(--color-b); }
.cmp-val-sep { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.cmp-sum-delta { font-size: 13px; font-weight: 700; margin-top: 4px; }
.cmp-sum-delta.pos { color: var(--green); }
.cmp-sum-delta.neg { color: var(--red); }
.cmp-sum-delta.zero { color: var(--text-muted); }

/* ─── comparison table ─── */
.tbl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow); }
.tbl-hdr { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.tbl-hdr h2 { font-size: 15px; font-weight: 700; }
.tbl-hdr .cnt { font-size: 12px; color: var(--text-secondary); }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl col:nth-child(1) { width: 25%; }
.tbl col:nth-child(2) { width: 10%; }
.tbl col:nth-child(3) { width: 10%; }
.tbl col:nth-child(4) { width: 10%; }
.tbl col:nth-child(5) { width: 10%; }
.tbl col:nth-child(6) { width: 10%; }
.tbl col:nth-child(7) { width: 10%; }
.tbl th { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
.tbl td { font-size: 13px; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; transition: background var(--transition); }
.tbl tbody tr:hover { background: var(--primary-light); }
.tbl tbody tr:last-child td { border-bottom: none; }
.val-a { color: var(--color-a); font-weight: 600; }
.val-b { color: var(--color-b); font-weight: 600; }
.delta-pos { color: var(--green); font-weight: 700; }
.delta-neg { color: var(--red); font-weight: 700; }
.delta-zero { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <h1>📊 报告管理中心</h1>
  <div class="hdr-meta"><span>{{GENERATED_TIME}}</span></div>
</div>

<div class="domain-tabs" id="domain-tabs"></div>

{{IF_REPORTS}}
<div class="section">
  <div class="rpt-bar">
    <span class="rpt-bar-label">查看报告</span>
    <select class="rpt-bar-select" id="rpt-select" onchange="onReportSelect()"><option value="">选择报告</option></select>
  </div>
</div>

<div class="section">
  <div class="charts-card">
    <div class="charts-hdr">
      <h2 id="trend-title">📈 数量趋势</h2>
      <div style="display:flex;gap:6px;">
        <button class="tb-btn active" id="trend-mode-count" onclick="setTrendMode('count')">数量</button>
        <button class="tb-btn" id="trend-mode-pct" onclick="setTrendMode('pct')">百分比</button>
      </div>
    </div>
    <div class="toolbar" id="trend-toolbar">
      <span class="tb-label">一级</span><select class="tb-select" id="trend-level1" onchange="onTrendFilterChange('level1')"><option value="">全部</option></select>
      <span class="tb-label">二级</span><select class="tb-select" id="trend-level2" onchange="onTrendFilterChange('level2')" disabled><option value="">全部</option></select>
      <span class="tb-label">三级</span><select class="tb-select" id="trend-level3" onchange="onTrendFilterChange('level3')" disabled><option value="">全部</option></select>
      <span class="tb-label">版本</span><select class="tb-select" id="trend-version" onchange="onTrendVersionChange()" disabled><option value="">全部</option></select>
      <span id="trend-path" class="tb-path"></span>
    </div>
    <div style="padding:24px;"><div class="ch-wrap"><canvas id="trendChart"></canvas></div></div>
  </div>
</div>

<div class="section">
  <div class="charts-card">
    <div class="charts-hdr">
      <h2>⚖️ 报告对比</h2>
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="tb-label">报告A</span><select class="tb-select" id="cmp-select-a" onchange="onCmpSelectChange()"><option value="">选择报告</option></select>
        <span class="tb-label">报告B</span><select class="tb-select" id="cmp-select-b" onchange="onCmpSelectChange()"><option value="">选择报告</option></select>
      </div>
    </div>

    <div class="cmp-summary" id="cmp-summary-area" style="display:none"></div>
    <div class="toolbar" id="cmp-filter-bar" style="display:none">
      <span class="tb-label">一级</span><select class="tb-select" id="filter-level1" onchange="onFilterChange('level1')"><option value="">全部</option></select>
      <span class="tb-label">二级</span><select class="tb-select" id="filter-level2" onchange="onFilterChange('level2')" disabled><option value="">全部</option></select>
      <span class="tb-label">三级</span><select class="tb-select" id="filter-level3" onchange="onFilterChange('level3')" disabled><option value="">全部</option></select>
      <span class="tb-label">版本</span><select class="tb-select" id="filter-version" onchange="onVersionChange()" disabled><option value="">全部</option></select>
      <span id="filter-path" class="tb-path"></span>
    </div>
    <div class="charts-body" id="cmp-charts-body" style="display:none">
      <div class="ch-wrap"><canvas id="cmpBarChart"></canvas></div>
      <div class="ch-wrap"><canvas id="cmpDeltaChart"></canvas></div>
    </div>
    <div style="padding:0 20px;display:none;border-top:1px solid var(--border);" id="cmp-table-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;"><h2 id="cmp-table-title" style="font-size:14px;font-weight:700;">分类对比明细</h2><span class="cnt" id="cmp-table-count">0 项</span></div>
      <table class="tbl" style="width:100%;">
        <colgroup><col><col><col><col><col><col><col></colgroup>
        <thead><tr><th>分类名称</th><th id="cmp-th-a">报告A</th><th>报告A占比</th><th id="cmp-th-b">报告B</th><th>报告B占比</th><th>变化量</th><th>占比变化</th></tr></thead>
        <tbody id="cmp-table-body"></tbody>
      </table>
    </div>
    <div class="pgn" id="cmp-pagination"></div>
    <div class="empty" id="cmp-empty">请选择两份报告进行对比</div>
  </div>
</div>
{{ENDIF_REPORTS}}
{{IF_NO_REPORTS}}
<div class="empty">没有找到任何报告数据。请先运行舆情分析生成报告后，再生成仪表盘。</div>
{{ENDIF_NO_REPORTS}}

</div>

<script id="domain-function" type="application/json">{{DOMAIN_FUNCTION_JSON}}</script>
<script id="domain-business" type="application/json">{{DOMAIN_BUSINESS_JSON}}</script>

<script>
// 按域加载仪表盘数据（每域可为 null：该域无数据）
function _loadBundle(name) {
  const el = document.getElementById('domain-' + name);
  if (!el || !el.textContent.trim()) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}
const dataByDomain = { function: _loadBundle("function"), business: _loadBundle("business") };
let activeDomain = "{{DEFAULT_DOMAIN}}";
if (!dataByDomain[activeDomain]) activeDomain = dataByDomain.function ? "function" : (dataByDomain.business ? "business" : "function");

const COLORS = ['#3b82f6','#f59e0b','#10b981','#ef4444','#8b5cf6','#14b8a6','#1f2937','#d97706','#6b7280','#f97316','#06b6d4','#0ea5e9','#a855f7','#334155','#dc2626','#1d4ed8'];
const COLOR_A = '#3b82f6';
const COLOR_B = '#f59e0b';
const COLOR_POS = '#10b981';
const COLOR_NEG = '#ef4444';

// 当前域的工作数据（applyDomain 切换时重新指向）
let reports = [];
let trendLabels = [];
let trendTotal = [];
let trendClassified = [];
let trendUnknown = [];
let trendFailed = [];
let level1Keys = [];
let level1Trend = {};
let comparisonData = {};

let trendMetric = 'all';
let trendCharts = {};
let cmpCharts = {};

// ─── report selector ───
function populateReportSelect() {
  const sel = document.getElementById('rpt-select');
  sel.innerHTML = '<option value="">选择报告</option>';
  reports.forEach(r => {
    sel.appendChild(new Option(r.name + '  (' + r.mtime.slice(0, 10) + ')', r.name));
  });
  sel.value = "";
}

function populateCmpSelects() {
  const selA = document.getElementById("cmp-select-a");
  const selB = document.getElementById("cmp-select-b");
  selA.innerHTML = '<option value="">选择报告</option>';
  selB.innerHTML = '<option value="">选择报告</option>';
  reports.forEach(r => {
    selA.appendChild(new Option(r.name + ' (' + r.mtime.slice(0, 10) + ')', r.name));
    selB.appendChild(new Option(r.name + ' (' + r.mtime.slice(0, 10) + ')', r.name));
  });
}

function onReportSelect() {
  const name = document.getElementById('rpt-select').value;
  if (!name) return;
  const r = reports.find(x => x.name === name);
  if (r && r.has_html) {
    window.open('./' + name + '/report.html', '_blank');
  }
  // 重置下拉框
  document.getElementById('rpt-select').value = "";
}

// ─── trend charts ───
let trendFilters = { level1: "", level2: "", level3: "" };
let trendVersion = "";
let trendMode = "count";

// 从所有报告汇总分类选项
function getTrendLevel1Options() {
  const keys = {};
  reports.forEach(r => {
    const d = comparisonData[r.name];
    Object.keys(d.level1_dist).forEach(k => { keys[k] = true; });
  });
  return sortedUnique(Object.keys(keys));
}

function getTrendLevel2Options(l1) {
  const keys = {};
  reports.forEach(r => {
    const d = comparisonData[r.name];
    if (d.level2_dist[l1]) Object.keys(d.level2_dist[l1]).forEach(k => { keys[k] = true; });
  });
  return sortedUnique(Object.keys(keys));
}

function getTrendLevel3Options(l1, l2) {
  const keys = {};
  reports.forEach(r => {
    const d = comparisonData[r.name];
    if (d.level3_dist[l1] && d.level3_dist[l1][l2]) Object.keys(d.level3_dist[l1][l2]).forEach(k => { keys[k] = true; });
  });
  return sortedUnique(Object.keys(keys));
}

function getTrendVersionOptions() {
  const keys = {};
  reports.forEach(r => {
    const d = comparisonData[r.name];
    d.versions.forEach(v => { keys[v] = true; });
  });
  return sortedUnique(Object.keys(keys));
}

function fillTrendSelect(id, options) {
  const sel = document.getElementById(id);
  const cur = sel.value;
  sel.innerHTML = '<option value="" title="全部">全部</option>';
  options.forEach(o => {
    const e = document.createElement("option");
    if (id === "trend-version" && o === "") { e.value = "__empty__"; e.textContent = "无版本号"; e.title = "无版本号"; }
    else { e.value = o; e.textContent = o; e.title = o; }
    sel.appendChild(e);
  });
  sel.value = options.includes(cur) ? cur : "";
}

function buildTrendData() {
  // 逐报告统计当前筛选条件下的数量和总数
  const counts = [];
  const totals = [];

  reports.forEach(r => {
    const d = comparisonData[r.name];
    let list = d.details;
    // 版本筛选
    if (trendVersion) {
      const fv = trendVersion === "__empty__" ? "" : trendVersion;
      list = list.filter(item => item.version === fv);
    }
    let allList = list;
    // 分类筛选
    if (trendFilters.level1) {
      list = list.filter(item => {
        const cls = item.classification || {};
        if (item.status === "classified") {
          if (trendFilters.level1 !== cls.level1) return false;
          if (trendFilters.level2 && trendFilters.level2 !== cls.level2) return false;
          if (trendFilters.level3 && trendFilters.level3 !== cls.level3) return false;
          return true;
        }
        if (item.status === "unknown_issue" && trendFilters.level1 === "未知问题") return true;
        return false;
      });
    }
    totals.push(allList.length);
    counts.push(list.length);
  });

  let title = trendMode === "pct" ? "占比趋势" : "数量趋势";
  if (trendFilters.level3) title = trendFilters.level1 + " › " + trendFilters.level2 + " › " + trendFilters.level3;
  else if (trendFilters.level2) title = trendFilters.level1 + " › " + trendFilters.level2;
  else if (trendFilters.level1) title = trendFilters.level1;
  if (trendVersion) title += (trendVersion === "__empty__" ? " (无版本号)" : " (" + trendVersion + ")");
  const emoji = trendMode === "pct" ? "📊" : "📈";
  document.getElementById("trend-title").textContent = emoji + " " + title;

  // 百分比模式下返回占比值
  if (trendMode === "pct") {
    return counts.map((c, i) => totals[i] > 0 ? round2(c / totals[i] * 100) : 0);
  }
  return counts;
}

function initTrendCharts() {
  const trendData = buildTrendData();
  const isPct = trendMode === "pct";
  trendCharts.mixed = new Chart(document.getElementById('trendChart'), {
    type: 'bar',
    data: { labels: trendLabels, datasets: [
      { type: 'bar', label: isPct ? '占比' : '数量', data: trendData, backgroundColor: '#3b82f6', borderRadius: 4, order: 2, barPercentage: 0.7, categoryPercentage: 0.7 },
      { type: 'line', label: isPct ? '占比趋势' : '数量趋势', data: trendData, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: false, tension: 0.3, pointRadius: 4, borderWidth: 2, order: 1 }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { usePointStyle: true, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => isPct ? ctx.dataset.label + ': ' + ctx.raw + '%' : ctx.dataset.label + ': ' + ctx.raw } }
      },

// ─── comparison ───
let cmpFilters = { level1: "", level2: "", level3: "" };
let cmpVersion = "";
let cmpPage = 1;
const cmpPageSize = 50;
let cmpLevel1Data = {};
let cmpLevel2Data = {};
let cmpLevel3Data = {};
let cmpLevel1DataOrig = {};
let cmpLevel2DataOrig = {};
let cmpLevel3DataOrig = {};
let cmpDetailsA = [];
let cmpDetailsB = [];
let cmpAllVersions = [];
let cmpTotalA = 0;
let cmpTotalB = 0;
let cmpNameA = "";
let cmpNameB = "";
let cmpSelected = false;

function sortedUnique(arr) { return [...new Set(arr)].sort(); }
function round2(n) { return Math.round(n * 100) / 100; }

function buildComparison(distA, distB, totalA, totalB) {
  const keys = sortedUnique(Object.keys(distA).concat(Object.keys(distB)));
  const r = {};
  keys.forEach(k => {
    const a = distA[k] || 0, b = distB[k] || 0;
    const pa = totalA > 0 ? round2(a / totalA * 100) : 0;
    const pb = totalB > 0 ? round2(b / totalB * 100) : 0;
    r[k] = { a, b, pct_a: pa, pct_b: pb, delta: b - a, delta_pct: round2(pb - pa) };
  });
  return r;
}

function buildNestedComparison(distA, distB, totalA, totalB) {
  const groups = sortedUnique(Object.keys(distA).concat(Object.keys(distB)));
  const r = {};
  groups.forEach(g => {
    const sA = distA[g] || {}, sB = distB[g] || {};
    r[g] = buildComparison(sA, sB, totalA, totalB);
  });
  return r;
}

function initCmpData() {
  const dataA = comparisonData[cmpNameA];
  const dataB = comparisonData[cmpNameB];
  cmpTotalA = dataA.summary.total;
  cmpTotalB = dataB.summary.total;
  cmpDetailsA = dataA.details;
  cmpDetailsB = dataB.details;
  cmpAllVersions = sortedUnique(dataA.versions.concat(dataB.versions));
  cmpLevel1DataOrig = buildComparison(dataA.level1_dist, dataB.level1_dist, cmpTotalA, cmpTotalB);
  cmpLevel2DataOrig = buildNestedComparison(dataA.level2_dist, dataB.level2_dist, cmpTotalA, cmpTotalB);
  cmpLevel3DataOrig = {};
  const l1s3 = sortedUnique(Object.keys(dataA.level3_dist).concat(Object.keys(dataB.level3_dist)));
  l1s3.forEach(l1 => {
    cmpLevel3DataOrig[l1] = buildNestedComparison(dataA.level3_dist[l1] || {}, dataB.level3_dist[l1] || {}, cmpTotalA, cmpTotalB);
  });
  cmpLevel1Data = cmpLevel1DataOrig;
  cmpLevel2Data = cmpLevel2DataOrig;
  cmpLevel3Data = cmpLevel3DataOrig;
  cmpFilters = { level1: "", level2: "", level3: "" };
  cmpVersion = "";
  cmpPage = 1;
  fillCmpSelect("filter-level1", Object.keys(cmpLevel1Data).sort());
  document.getElementById("filter-level1").disabled = false;
  const s2 = document.getElementById("filter-level2"); s2.disabled = true; s2.innerHTML = '<option value="">全部</option>';
  const s3 = document.getElementById("filter-level3"); s3.disabled = true; s3.innerHTML = '<option value="">全部</option>';
  fillCmpSelect("filter-version", cmpAllVersions);
  document.getElementById("filter-version").disabled = cmpAllVersions.length === 0;
}

// ─── dynamic recomputation by version ───
function countByLevel(list, level) {
  const c = {};
  list.forEach(item => {
    if (item.status === "classified" && item.classification) {
      const v = item.classification[level] || "";
      if (v) c[v] = (c[v] || 0) + 1;
    } else if (item.status === "unknown_issue" && level === "level1") {
      c["未知问题"] = (c["未知问题"] || 0) + 1;
    }
  });
  return c;
}

function countByLevel2(list) {
  const c = {};
  list.forEach(item => {
    if (item.status === "classified" && item.classification) {
      const l1 = item.classification.level1 || "", l2 = item.classification.level2 || "";
      if (l1 && l2) { if (!c[l1]) c[l1] = {}; c[l1][l2] = (c[l1][l2] || 0) + 1; }
    }
  });
  return c;
}

function countByLevel3(list) {
  const c = {};
  list.forEach(item => {
    if (item.status === "classified" && item.classification) {
      const l1 = item.classification.level1 || "", l2 = item.classification.level2 || "", l3 = item.classification.level3 || "";
      if (l1 && l2 && l3) { if (!c[l1]) c[l1] = {}; if (!c[l1][l2]) c[l1][l2] = {}; c[l1][l2][l3] = (c[l1][l2][l3] || 0) + 1; }
    }
  });
  return c;
}

function recomputeCmpByVersion(ver) {
  const filterVer = ver === "__empty__" ? "" : (ver ? ver : null);
  const listA = filterVer !== null ? cmpDetailsA.filter(d => d.version === filterVer) : cmpDetailsA;
  const listB = filterVer !== null ? cmpDetailsB.filter(d => d.version === filterVer) : cmpDetailsB;
  cmpTotalA = listA.length;
  cmpTotalB = listB.length;
  const d1A = countByLevel(listA, "level1"), d1B = countByLevel(listB, "level1");
  cmpLevel1Data = buildComparison(d1A, d1B, cmpTotalA, cmpTotalB);
  const d2A = countByLevel2(listA), d2B = countByLevel2(listB);
  cmpLevel2Data = buildNestedComparison(d2A, d2B, cmpTotalA, cmpTotalB);
  const d3A = countByLevel3(listA), d3B = countByLevel3(listB);
  const l1s3 = sortedUnique(Object.keys(d3A).concat(Object.keys(d3B)));
  cmpLevel3Data = {};
  l1s3.forEach(l1 => { cmpLevel3Data[l1] = buildNestedComparison(d3A[l1] || {}, d3B[l1] || {}, cmpTotalA, cmpTotalB); });
  // Refill dropdowns after recomputation
  fillCmpSelect("filter-level1", Object.keys(cmpLevel1Data).sort());
  document.getElementById("filter-level1").value = cmpFilters.level1;
  if (cmpFilters.level1) {
    fillCmpSelect("filter-level2", getAvailableLevel2(cmpFilters.level1));
    document.getElementById("filter-level2").value = cmpFilters.level2;
    document.getElementById("filter-level2").disabled = false;
    if (cmpFilters.level2) {
      fillCmpSelect("filter-level3", getAvailableLevel3(cmpFilters.level1, cmpFilters.level2));
      document.getElementById("filter-level3").value = cmpFilters.level3;
      document.getElementById("filter-level3").disabled = false;
    }
  }
}

// ─── filter helpers ───
function getAvailableLevel2(l1) {
  if (l1 && cmpLevel2Data[l1]) return sortedUnique(Object.keys(cmpLevel2Data[l1]));
  return sortedUnique(Object.values(cmpLevel2Data).flatMap(sub => Object.keys(sub)));
}

function getAvailableLevel3(l1, l2) {
  if (l1 && l2 && cmpLevel3Data[l1] && cmpLevel3Data[l1][l2]) return sortedUnique(Object.keys(cmpLevel3Data[l1][l2]));
  if (l1 && cmpLevel3Data[l1]) return sortedUnique(Object.values(cmpLevel3Data[l1]).flatMap(sub => Object.keys(sub)));
  return sortedUnique(Object.values(cmpLevel3Data).flatMap(l2s => Object.values(l2s).flatMap(sub => Object.keys(sub))));
}

// ─── summary ───
function renderCmpSummary() {
  const summaryA = comparisonData[cmpNameA].summary;
  const summaryB = comparisonData[cmpNameB].summary;
  const labels = { total: '总数据', classified: '已分类', unknown_issue: '未知问题', infer_failed: '失败' };
  let h = '';
  for (const [k, label] of Object.entries(labels)) {
    const a = summaryA[k] || 0, b = summaryB[k] || 0;
    const delta = b - a;
    const deltaStr = delta === 0 ? '0' : (delta > 0 ? '+' + delta : delta);
    const cls = delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'zero';
    h += '<div class="cmp-sum-item"><div class="cmp-sum-label">' + label + '</div>'
       + '<div class="cmp-sum-vals"><span class="cmp-val-a">' + a + '</span>'
       + '<span class="cmp-val-sep">vs</span>'
       + '<span class="cmp-val-b">' + b + '</span></div>'
       + '<div class="cmp-sum-delta ' + cls + '">' + deltaStr + '</div></div>';
  }
  document.getElementById("cmp-summary-area").innerHTML = h;
}

// ─── charts ───
function getCurrentCmpData() {
  if (cmpFilters.level1 && cmpFilters.level2 && cmpFilters.level3) {
    // 三级已选中：只展示当前选中的三级分类数据
    const sub = cmpLevel3Data[cmpFilters.level1] && cmpLevel3Data[cmpFilters.level1][cmpFilters.level2];
    const item = sub && sub[cmpFilters.level3];
    if (item) return { [cmpFilters.level3]: item };
    return {};
  }
  if (cmpFilters.level1 && cmpFilters.level2 && cmpLevel3Data[cmpFilters.level1] && cmpLevel3Data[cmpFilters.level1][cmpFilters.level2]) {
    return cmpLevel3Data[cmpFilters.level1][cmpFilters.level2];
  }
  if (cmpFilters.level1 && cmpLevel2Data[cmpFilters.level1]) {
    return cmpLevel2Data[cmpFilters.level1];
  }
  return cmpLevel1Data;
}

function updateCmpCharts() {
  const data = getCurrentCmpData();
  const labels = Object.keys(data);

  let title;
  if (cmpFilters.level1 && cmpFilters.level2 && cmpFilters.level3) title = cmpFilters.level1 + ' › ' + cmpFilters.level2 + ' › ' + cmpFilters.level3;
  else if (cmpFilters.level1 && cmpFilters.level2) title = cmpFilters.level1 + ' › ' + cmpFilters.level2;
  else if (cmpFilters.level1) title = cmpFilters.level1;
  else title = "全部";
  document.getElementById("cmp-table-title").textContent = "📋 " + title;

  const barLabels = labels.map(l => l.length > 10 ? l.slice(0, 10) + '…' : l);

  const onClickHandler = (_, els) => {
    if (!els.length) return;
    const v = labels[els[0].index];
    if (cmpFilters.level1 && cmpFilters.level2) setCmpF3(cmpFilters.level1, cmpFilters.level2, v);
    else if (cmpFilters.level1) setCmpF2(cmpFilters.level1, v);
    else setCmpF1(v);
  };

  if (cmpCharts.bar) cmpCharts.bar.destroy();
  const barCtx = document.getElementById("cmpBarChart").getContext("2d");
  cmpCharts.bar = new Chart(barCtx, {
    type: "bar",
    data: { labels: barLabels, datasets: [
      { label: cmpNameA, data: labels.map(l => data[l].a), backgroundColor: COLOR_A, borderRadius: 4 },
      { label: cmpNameB, data: labels.map(l => data[l].b), backgroundColor: COLOR_B, borderRadius: 4 },
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "top", labels: { usePointStyle: true, font: { size: 11 } } },
        tooltip: { callbacks: {
          title: items => labels[items[0].dataIndex],
          afterBody: items => {
            const d = data[labels[items[0].dataIndex]];
            return "变化量: " + (d.delta > 0 ? "+" : "") + d.delta + "\n占比变化: " + (d.delta_pct > 0 ? "+" : "") + d.delta_pct + "%";
          }
        }}
      },
      scales: { y: { beginAtZero: true, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } },
      onClick: onClickHandler
    }
  });

  if (cmpCharts.delta) cmpCharts.delta.destroy();
  const deltaCtx = document.getElementById("cmpDeltaChart").getContext("2d");
  const deltas = labels.map(l => data[l].delta_pct);
  cmpCharts.delta = new Chart(deltaCtx, {
    type: "bar",
    data: { labels: barLabels, datasets: [
      { label: "增加", data: deltas.map(d => d > 0 ? d : 0), backgroundColor: COLOR_POS, borderRadius: 4 },
      { label: "减少", data: deltas.map(d => d < 0 ? d : 0), backgroundColor: COLOR_NEG, borderRadius: 4 },
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "top", labels: { usePointStyle: true, font: { size: 11 } } },
        tooltip: { callbacks: { title: items => labels[items[0].dataIndex], label: ctx => ctx.dataset.label + ": " + (ctx.raw > 0 ? "+" : "") + ctx.raw + "%" } }
      },
      scales: { y: { grid: { color: '#f0f0f0' }, ticks: { callback: v => v + "%" } }, x: { grid: { display: false } } },
      onClick: onClickHandler
    }
  });
}

// ─── table ───
function getCmpTableData() {
  const data = getCurrentCmpData();
  const keys = Object.keys(data);
  return keys.map(k => ({
    name: k, a: data[k].a, pct_a: data[k].pct_a,
    b: data[k].b, pct_b: data[k].pct_b,
    delta: data[k].delta, delta_pct: data[k].delta_pct,
  })).sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta) || Math.abs(y.delta_pct) - Math.abs(x.delta_pct));
}

function isCmpDrillable(name) {
  if (!cmpFilters.level1) return cmpLevel2Data[name] && Object.keys(cmpLevel2Data[name]).length > 0;
  if (cmpFilters.level1 && !cmpFilters.level2) return cmpLevel3Data[cmpFilters.level1] && cmpLevel3Data[cmpFilters.level1][name] && Object.keys(cmpLevel3Data[cmpFilters.level1][name]).length > 0;
  return false;
}

function updateCmpTable() {
  const tableData = getCmpTableData();
  document.getElementById("cmp-table-count").textContent = tableData.length + " 项";
  const totalPages = Math.ceil(tableData.length / cmpPageSize);
  if (cmpPage > totalPages) cmpPage = totalPages || 1;
  const start = (cmpPage - 1) * cmpPageSize;
  const pageData = tableData.slice(start, start + cmpPageSize);
  const tbody = document.getElementById("cmp-table-body");
  tbody.innerHTML = "";
  pageData.forEach(item => {
    const row = document.createElement("tr");
    const drillable = isCmpDrillable(item.name);
    if (drillable) row.classList.add("drillable");
    const deltaCls = item.delta > 0 ? "delta-pos" : item.delta < 0 ? "delta-neg" : "delta-zero";
    const deltaStr = item.delta === 0 ? "0" : (item.delta > 0 ? "+" + item.delta : item.delta);
    const deltaPctCls = item.delta_pct > 0 ? "delta-pos" : item.delta_pct < 0 ? "delta-neg" : "delta-zero";
    const deltaPctStr = item.delta_pct === 0 ? "0%" : (item.delta_pct > 0 ? "+" + item.delta_pct + "%" : item.delta_pct + "%");
    const nameHtml = drillable ? '<span style="cursor:pointer;color:var(--primary)">' + item.name + ' ▸</span>' : item.name;
    row.innerHTML = "<td>" + nameHtml + "</td>" +
      "<td><span class='val-a'>" + item.a + "</span></td>" +
      "<td>" + item.pct_a + "%</td>" +
      "<td><span class='val-b'>" + item.b + "</span></td>" +
      "<td>" + item.pct_b + "%</td>" +
      "<td><span class='" + deltaCls + "'>" + deltaStr + "</span></td>" +
      "<td><span class='" + deltaPctCls + "'>" + deltaPctStr + "</span></td>";
    if (drillable) {
      row.addEventListener("click", () => {
        if (!cmpFilters.level1) setCmpF1(item.name);
        else if (cmpFilters.level1 && !cmpFilters.level2) setCmpF2(cmpFilters.level1, item.name);
      });
    }
    tbody.appendChild(row);
  });
  updateCmpPagination(tableData.length, totalPages);
}

function updateCmpPagination(total, totalPages) {
  const pgn = document.getElementById("cmp-pagination");
  if (totalPages <= 1) { pgn.innerHTML = ""; return; }
  let h = '<button onclick="goCmpPage(1)" ' + (cmpPage === 1 ? 'disabled' : '') + '>首</button>';
  h += '<button onclick="goCmpPage(' + (cmpPage-1) + ')" ' + (cmpPage === 1 ? 'disabled' : '') + '>上一页</button>';
  const start = Math.max(1, cmpPage - 2), end = Math.min(totalPages, cmpPage + 2);
  for (let p = start; p <= end; p++) h += '<button onclick="goCmpPage(' + p + ')" class="' + (p === cmpPage ? 'act' : '') + '">' + p + '</button>';
  h += '<button onclick="goCmpPage(' + (cmpPage+1) + ')" ' + (cmpPage === totalPages ? 'disabled' : '') + '>下一页</button>';
  h += '<span class="info">' + cmpPage + '/' + totalPages + '</span>';
  pgn.innerHTML = h;
}

function goCmpPage(p) { cmpPage = p; updateCmpTable(); }

function updateCmpAll() { updateCmpCharts(); updateCmpBreadcrumb(); updateCmpTable(); }

// ─── 域切换 ───
function renderDomainTabs() {
  const el = document.getElementById("domain-tabs");
  if (!el) return;
  const tabs = [["function", "功能域"], ["business", "业务域"]];
  const available = tabs.filter(([d]) => dataByDomain[d]);
  if (available.length === 0) { el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = available.map(([d, label]) =>
    `<div class="domain-tab${d === activeDomain ? ' active' : ''}" data-domain="${d}" onclick="switchDomain('${d}')">${label}</div>`
  ).join("");
}

function _destroyCharts() {
  for (const k of Object.keys(trendCharts)) { try { trendCharts[k].destroy(); } catch (e) {} }
  for (const k of Object.keys(cmpCharts)) { try { cmpCharts[k].destroy(); } catch (e) {} }
  trendCharts = {}; cmpCharts = {};
}

function applyDomain(d) {
  const b = dataByDomain[d];
  if (!b) return;
  activeDomain = d;
  reports = b.reports || [];
  trendLabels = b.trend_labels || [];
  trendTotal = b.trend_total || [];
  trendClassified = b.trend_classified || [];
  trendUnknown = b.trend_unknown || [];
  trendFailed = b.trend_failed || [];
  level1Keys = b.level1_keys || [];
  level1Trend = b.level1_trend || {};
  comparisonData = b.comparison_data || {};

  // 重置筛选与图表
  trendFilters = { level1: "", level2: "", level3: "" };
  trendVersion = ""; trendMode = "count"; trendMetric = "all";
  cmpNameA = ""; cmpNameB = ""; cmpFilters = { level1: "", level2: "", level3: "" };
  cmpVersion = ""; cmpPage = 1; cmpSelected = false;
  _destroyCharts();

  populateReportSelect();
  populateCmpSelects();
  if (reports.length === 0) return;
  initTrendCharts();
  // 默认对比前两个报告
  if (reports.length >= 2) {
    document.getElementById("cmp-select-a").value = reports[0].name;
    document.getElementById("cmp-select-b").value = reports[1].name;
    onCmpSelectChange();
  }
  document.querySelectorAll('.domain-tab').forEach(t => t.classList.toggle('active', t.dataset.domain === d));
}

function switchDomain(d) { if (d === activeDomain || !dataByDomain[d]) return; applyDomain(d); }

// ─── init ───
document.addEventListener('DOMContentLoaded', () => {
  try {
    renderDomainTabs();
    if (!dataByDomain[activeDomain]) return;  // 两域均无数据
    applyDomain(activeDomain);
  } catch (err) {
    document.body.innerHTML += '<div style="margin:20px;padding:16px;background:#fce4e4;color:#c0392b;border-radius:8px;font-size:14px;"><strong>JS Error:</strong> ' + err.message + '<br><pre>' + err.stack + '</pre></div>';
  }
});
</script>
