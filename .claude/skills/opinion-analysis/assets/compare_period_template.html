<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舆情周期对比报告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f4f6f9; --surface: #ffffff; --border: #e4e8ed;
  --text: #1f2937; --text-secondary: #6b7280; --text-muted: #9ca3af;
  --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #eff6ff; --primary-glow: rgba(59,130,246,.12);
  --color-a: #3b82f6; --color-b: #f59e0b;
  --green: #10b981; --green-bg: #ecfdf5;
  --orange: #f59e0b; --orange-bg: #fffbeb;
  --red: #ef4444; --red-bg: #fef2f2;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04);
  --radius: 10px; --radius-sm: 6px;
  --transition: .18s ease;
}
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 24px auto; padding: 0 20px; }

.hdr { padding: 24px 28px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 60%, #1d4ed8 100%); border-radius: var(--radius); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; box-shadow: var(--shadow-lg); }
.hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px; color: #fff; }
.hdr-meta { font-size: 13px; color: rgba(255,255,255,.85); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hdr-meta .tag { padding: 3px 10px; border-radius: 4px; font-weight: 700; font-size: 12px; letter-spacing: .3px; }
.hdr-meta .tag-a { background: rgba(59,130,246,.3); color: rgba(255,255,255,.95); }
.hdr-meta .tag-b { background: rgba(245,158,11,.3); color: rgba(255,255,255,.95); }
.hdr-meta .time { font-size: 11px; color: rgba(255,255,255,.6); }

.cmp-summary { display: flex; gap: 0; margin-bottom: 0; background: var(--surface); overflow: hidden; }
.cmp-sum-item { flex: 1; padding: 16px 20px; text-align: center; transition: background var(--transition); }
.cmp-sum-item:hover { background: var(--primary-light); }
.cmp-sum-item + .cmp-sum-item { border-left: 1px solid var(--border); }
.cmp-sum-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: .3px; font-weight: 700; }
.cmp-sum-vals { display: flex; justify-content: center; align-items: center; gap: 8px; }
.cmp-val-a { font-size: 22px; font-weight: 800; color: var(--color-a); }
.cmp-val-b { font-size: 22px; font-weight: 800; color: var(--color-b); }
.cmp-val-sep { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.cmp-sum-delta { font-size: 13px; font-weight: 700; margin-top: 4px; }
.cmp-sum-delta.pos { color: var(--green); }
.cmp-sum-delta.neg { color: var(--red); }
.cmp-sum-delta.zero { color: var(--text-muted); }

.toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--primary-light); border-bottom: 1px solid rgba(59,130,246,.15); flex-wrap: wrap; }
.tb-label { font-size: 11px; color: var(--primary-hover); font-weight: 700; white-space: nowrap; letter-spacing: .3px; }
.tb-select { font-size: 13px; padding: 5px 26px 5px 8px; border: 1px solid rgba(59,130,246,.2); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: all var(--transition); }
.tb-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.tb-select:disabled { opacity: .45; cursor: default; }
.tb-btn { font-size: 12px; padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
.tb-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 4px rgba(59,130,246,.25); }
.tb-btn:hover:not(.active) { background: var(--bg); border-color: var(--primary); color: var(--primary); }
.tb-path { font-size: 13px; color: var(--text-secondary); flex-basis: 100%; }
.tb-path .p { color: var(--primary); cursor: pointer; transition: color var(--transition); }
.tb-path .p:hover { color: var(--primary-hover); text-decoration: underline; }
.tb-path .sep { color: var(--text-muted); margin: 0 4px; }

.charts-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow); }
.domain-tabs { display: none; gap: 6px; margin-bottom: 16px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: fit-content; box-shadow: var(--shadow); }
.domain-tab { padding: 7px 18px; font-size: 13px; font-weight: 600; color: var(--text-secondary); border-radius: 6px; cursor: pointer; transition: all .2s; user-select: none; }
.domain-tab:hover:not(.active) { background: var(--primary-light); color: var(--primary); }
.domain-tab.active { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.charts-hdr { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.charts-hdr h2 { font-size: 15px; font-weight: 700; }
.charts-body { padding: 24px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.ch-wrap { height: 300px; position: relative; }

.tbl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.tbl-hdr { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.tbl-hdr h2 { font-size: 15px; font-weight: 700; }
.tbl-hdr .cnt { font-size: 12px; color: var(--text-secondary); }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl col:nth-child(1) { width: 25%; }
.tbl col:nth-child(2) { width: 10%; }
.tbl col:nth-child(3) { width: 10%; }
.tbl col:nth-child(4) { width: 10%; }
.tbl col:nth-child(5) { width: 10%; }
.tbl col:nth-child(6) { width: 10%; }
.tbl col:nth-child(7) { width: 10%; }
.tbl th { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
.tbl td { font-size: 13px; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; transition: background var(--transition); }
.tbl tbody tr:hover { background: var(--primary-light); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr.drillable { cursor: pointer; transition: background var(--transition); }
.val-a { color: var(--color-a); font-weight: 600; }
.val-b { color: var(--color-b); font-weight: 600; }
.delta-pos { color: var(--green); font-weight: 700; }
.delta-neg { color: var(--red); font-weight: 700; }
.delta-zero { color: var(--text-muted); }

.pgn { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pgn button { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
.pgn button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.pgn button:disabled { opacity: .35; cursor: default; }
.pgn button.act { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 4px rgba(59,130,246,.25); }
.pgn .info { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <h1>⚖️ 舆情周期对比报告</h1>
  <div class="hdr-meta">
    <span class="tag tag-a">{{LABEL_A}}</span>
    <span>vs</span>
    <span class="tag tag-b">{{LABEL_B}}</span>
    <span class="time">{{GENERATED_TIME}}</span>
  </div>
</div>

<div class="domain-tabs" id="domain-tabs"></div>

<div class="charts-card">
  <div class="cmp-summary" id="summary-area"></div>
  <div class="toolbar">
    <span class="tb-label">一级</span><select class="tb-select" id="filter-level1" onchange="onFilterChange('level1')"><option value="">全部</option></select>
    <span class="tb-label">二级</span><select class="tb-select" id="filter-level2" onchange="onFilterChange('level2')" disabled><option value="">全部</option></select>
    <span class="tb-label">三级</span><select class="tb-select" id="filter-level3" onchange="onFilterChange('level3')" disabled><option value="">全部</option></select>
    <span class="tb-label">版本</span><select class="tb-select" id="filter-version" onchange="onVersionChange()" disabled><option value="">全部</option></select>
    <span id="filter-path" class="tb-path"></span>
  </div>
  <div class="charts-hdr"><h2 id="charts-title">📋 一级分类对比</h2></div>
  <div class="charts-body">
    <div class="ch-wrap"><canvas id="barChart"></canvas></div>
    <div class="ch-wrap"><canvas id="deltaChart"></canvas></div>
  </div>
</div>

<div class="tbl-card">
  <div class="tbl-hdr"><h2 id="tbl-title">分类对比明细</h2><span class="cnt" id="table-count">0 项</span></div>
  <div class="tbl-scroll">
    <table class="tbl">
      <colgroup><col><col><col><col><col><col><col></colgroup>
      <thead><tr><th>分类名称</th><th>{{LABEL_A}}</th><th>{{LABEL_A}}占比</th><th>{{LABEL_B}}</th><th>{{LABEL_B}}占比</th><th>变化量</th><th>占比变化</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div class="pgn" id="pagination"></div>
</div>

</div>

<script id="domain-function" type="application/json">{{DOMAIN_FUNCTION_JSON}}</script>
<script id="domain-business" type="application/json">{{DOMAIN_BUSINESS_JSON}}</script>
<script id="meta-data" type="application/json">{{META_JSON}}</script>

<script>
const LABEL_A = "{{LABEL_A}}";
const LABEL_B = "{{LABEL_B}}";
const metaData = JSON.parse(document.getElementById('meta-data').textContent);

// 按域加载对比数据（每域可为 null：该域无数据，页面展示空）
function _loadBundle(name) {
  const el = document.getElementById('domain-' + name);
  if (!el || !el.textContent.trim()) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}
const dataByDomain = { function: _loadBundle("function"), business: _loadBundle("business") };
let activeDomain = "{{DEFAULT_DOMAIN}}";
if (!dataByDomain[activeDomain]) activeDomain = dataByDomain.function ? "function" : (dataByDomain.business ? "business" : "function");

const COLORS_A = "#3b82f6";
const COLORS_B = "#f59e0b";
const COLOR_POS = "#10b981";
const COLOR_NEG = "#ef4444";

// ─── state ───
let filters = { level1: "", level2: "", level3: "" };
let versionFilter = "";
let viewMode = "count";  // 固定数量模式，不可切换
let currentPage = 1;
const pageSize = 50;
let charts = {};

// 当前域的工作数据（由 applyDomain 切换时重新指向）
let summaryData = {};
let level1DataOrig = {};
let level2DataOrig = {};
let level3DataOrig = {};
let detailsA = [];
let detailsB = [];
let allVersions = [];

// Current comparison data (may be recomputed when version changes)
let level1Data = level1DataOrig;
let level2Data = level2DataOrig;
let level3Data = level3DataOrig;

// ─── summary ───
function renderSummary() {
  const area = document.getElementById("summary-area");
  const labels = { total: "总数据", classified: "已分类", unknown_issue: "未知问题", infer_failed: "失败" };
  let h = "";
  for (const [k, label] of Object.entries(labels)) {
    const d = summaryData[k];
    const deltaStr = d.delta === 0 ? "0" : (d.delta > 0 ? "+" + d.delta : d.delta);
    const cls = d.delta > 0 ? "pos" : d.delta < 0 ? "neg" : "zero";
    h += '<div class="cmp-sum-item"><div class="cmp-sum-label">' + label + '</div>'
       + '<div class="cmp-sum-vals"><span class="cmp-val-a">' + d.a + '</span>'
       + '<span class="cmp-val-sep">vs</span>'
       + '<span class="cmp-val-b">' + d.b + '</span></div>'
       + '<div class="cmp-sum-delta ' + cls + '">' + deltaStr + '</div></div>';
  }
  area.innerHTML = h;
}

// ─── dynamic recomputation ───
function countByLevel(list, level) {
  const c = {};
  list.forEach(item => {
    if (item.status === "classified" && item.classification) {
      const v = item.classification[level] || "";
      if (v) c[v] = (c[v] || 0) + 1;
    } else if (item.status === "unknown_issue" && level === "level1") {
      c["未知问题"] = (c["未知问题"] || 0) + 1;
    }
  });
  return c;
}

function countByLevel2(list) {
  const c = {};
  list.forEach(item => {
    if (item.status === "classified" && item.classification) {
      const l1 = item.classification.level1 || "", l2 = item.classification.level2 || "";
      if (l1 && l2) { if (!c[l1]) c[l1] = {}; c[l1][l2] = (c[l1][l2] || 0) + 1; }
    }
  });
  return c;
}

function countByLevel3(list) {
  const c = {};
  list.forEach(item => {
    if (item.status === "classified" && item.classification) {
      const l1 = item.classification.level1 || "", l2 = item.classification.level2 || "", l3 = item.classification.level3 || "";
      if (l1 && l2 && l3) { if (!c[l1]) c[l1] = {}; if (!c[l1][l2]) c[l1][l2] = {}; c[l1][l2][l3] = (c[l1][l2][l3] || 0) + 1; }
    }
  });
  return c;
}

function buildComparison(distA, distB, totalA, totalB) {
  const keys = sortedUnique(Object.keys(distA).concat(Object.keys(distB)));
  const r = {};
  keys.forEach(k => {
    const a = distA[k] || 0, b = distB[k] || 0;
    const pa = totalA > 0 ? round2(a / totalA * 100) : 0;
    const pb = totalB > 0 ? round2(b / totalB * 100) : 0;
    r[k] = { a, b, pct_a: pa, pct_b: pb, delta: b - a, delta_pct: round2(pb - pa) };
  });
  return r;
}

function buildNestedComparison(distA, distB, totalA, totalB) {
  const groups = sortedUnique(Object.keys(distA).concat(Object.keys(distB)));
  const r = {};
  groups.forEach(g => {
    const sA = distA[g] || {}, sB = distB[g] || {};
    r[g] = buildComparison(sA, sB, totalA, totalB);
  });
  return r;
}

function sortedUnique(arr) { return [...new Set(arr)].sort(); }
function round2(n) { return Math.round(n * 100) / 100; }

function recomputeComparison(ver) {
  // ver="__empty__" means filter for items with empty version; ver="" means show all
  const filterVer = ver === "__empty__" ? "" : (ver ? ver : null);
  const listA = filterVer !== null ? detailsA.filter(d => d.version === filterVer) : detailsA;
  const listB = filterVer !== null ? detailsB.filter(d => d.version === filterVer) : detailsB;
  const totalA = listA.length, totalB = listB.length;

  const d1A = countByLevel(listA, "level1"), d1B = countByLevel(listB, "level1");
  level1Data = buildComparison(d1A, d1B, totalA, totalB);

  const d2A = countByLevel2(listA), d2B = countByLevel2(listB);
  level2Data = buildNestedComparison(d2A, d2B, totalA, totalB);

  const d3A = countByLevel3(listA), d3B = countByLevel3(listB);
  const l1s3 = sortedUnique(Object.keys(d3A).concat(Object.keys(d3B)));
  level3Data = {};
  l1s3.forEach(l1 => {
    level3Data[l1] = buildNestedComparison(d3A[l1] || {}, d3B[l1] || {}, totalA, totalB);
  });

  // Update filter dropdowns
  const opts = getAllOptions();
  fillSelect("filter-level1", opts.level1s);
  document.getElementById("filter-level1").value = filters.level1;
  if (filters.level1) {
    fillSelect("filter-level2", opts.level2s);
    document.getElementById("filter-level2").value = filters.level2;
    document.getElementById("filter-level2").disabled = false;
    if (filters.level2) {
      fillSelect("filter-level3", opts.level3s);
      document.getElementById("filter-level3").value = filters.level3;
      document.getElementById("filter-level3").disabled = false;
    }
  }
}

// ─── filter helpers ───
function getAllOptions() {
  const level1s = {}, level2s = {}, level3s = {};
  // Scan level1Data (current, possibly recomputed) for available options
  Object.keys(level1Data).forEach(k => { level1s[k] = true; });
  // Scan level2Data for level2 options under current level1 (or all)
  if (filters.level1 && level2Data[filters.level1]) {
    Object.keys(level2Data[filters.level1]).forEach(k => { level2s[k] = true; });
  } else {
    Object.values(level2Data).forEach(sub => Object.keys(sub).forEach(k => { level2s[k] = true; }));
  }
  // Scan level3Data for level3 options
  if (filters.level1 && filters.level2 && level3Data[filters.level1] && level3Data[filters.level1][filters.level2]) {
    Object.keys(level3Data[filters.level1][filters.level2]).forEach(k => { level3s[k] = true; });
  } else if (filters.level1 && level3Data[filters.level1]) {
    Object.values(level3Data[filters.level1]).forEach(sub => Object.keys(sub).forEach(k => { level3s[k] = true; }));
  } else {
    Object.values(level3Data).forEach(l2s => Object.values(l2s).forEach(sub => Object.keys(sub).forEach(k => { level3s[k] = true; })));
  }
  return { level1s: sortedUnique(Object.keys(level1s)), level2s: sortedUnique(Object.keys(level2s)), level3s: sortedUnique(Object.keys(level3s)) };
}

function getAvailableLevel2(l1) {
  if (l1 && level2Data[l1]) return sortedUnique(Object.keys(level2Data[l1]));
  return sortedUnique(Object.values(level2Data).flatMap(sub => Object.keys(sub)));
}

function getAvailableLevel3(l1, l2) {
  if (l1 && l2 && level3Data[l1] && level3Data[l1][l2]) return sortedUnique(Object.keys(level3Data[l1][l2]));
  if (l1 && level3Data[l1]) return sortedUnique(Object.values(level3Data[l1]).flatMap(sub => Object.keys(sub)));
  return sortedUnique(Object.values(level3Data).flatMap(l2s => Object.values(l2s).flatMap(sub => Object.keys(sub))));
}

function fillSelect(id, options) {
  const sel = document.getElementById(id);
  const cur = sel.value;
  sel.innerHTML = '<option value="" title="全部">全部</option>';
  options.forEach(o => {
    const e = document.createElement("option");
    if (id === "filter-version" && o === "") { e.value = "__empty__"; e.textContent = "无版本号"; e.title = "无版本号"; }
    else { e.value = o; e.textContent = o; e.title = o; }
    sel.appendChild(e);
  });
  sel.value = options.includes(cur) ? cur : "";
}

// ─── filter handlers ───
function onFilterChange(src) {
  const s1 = document.getElementById("filter-level1"), s2 = document.getElementById("filter-level2"), s3 = document.getElementById("filter-level3");
  // Always sync all dropdown values to filters first
  filters.level1 = s1.value;
  filters.level2 = s2.value;
  filters.level3 = s3.value;
  if (src === "level1") {
    if (filters.level1) { fillSelect("filter-level2", getAvailableLevel2(filters.level1)); s2.disabled = false; s3.disabled = true; s3.innerHTML = '<option value="">全部</option>'; }
    else { s2.disabled = true; s2.innerHTML = '<option value="">全部</option>'; s3.disabled = true; s3.innerHTML = '<option value="">全部</option>'; }
    filters.level2 = ""; filters.level3 = "";
    s2.value = ""; s3.value = "";
  } else if (src === "level2") {
    if (filters.level2) { fillSelect("filter-level3", getAvailableLevel3(filters.level1, filters.level2)); s3.disabled = false; }
    else { s3.disabled = true; s3.innerHTML = '<option value="">全部</option>'; }
    filters.level3 = "";
    s3.value = "";
  }
  // src === "level3" needs no special handling beyond the sync above
  currentPage = 1; updateAll();
}

function onVersionChange() {
  const newVer = document.getElementById("filter-version").value;
  // Reset level1/2/3 filters when version changes
  if (newVer !== versionFilter) {
    filters = { level1: "", level2: "", level3: "" };
    fillSelect("filter-level1", Object.keys(level1Data).sort());
    document.getElementById("filter-level1").value = "";
    document.getElementById("filter-level2").disabled = true; document.getElementById("filter-level2").innerHTML = '<option value="">全部</option>';
    document.getElementById("filter-level3").disabled = true; document.getElementById("filter-level3").innerHTML = '<option value="">全部</option>';
  }
  versionFilter = newVer;
  recomputeComparison(versionFilter);
  currentPage = 1; updateAll();
}

function setF1(val) {
  filters.level1 = val; filters.level2 = ""; filters.level3 = "";
  document.getElementById("filter-level1").value = val;
  fillSelect("filter-level2", getAvailableLevel2(val)); document.getElementById("filter-level2").disabled = false;
  document.getElementById("filter-level2").value = "";
  document.getElementById("filter-level3").disabled = true; document.getElementById("filter-level3").innerHTML = '<option value="">全部</option>';
  currentPage = 1; updateAll();
}

function setF2(l1, l2) {
  filters.level1 = l1; filters.level2 = l2; filters.level3 = "";
  document.getElementById("filter-level1").value = l1;
  fillSelect("filter-level2", getAvailableLevel2(l1)); document.getElementById("filter-level2").disabled = false; document.getElementById("filter-level2").value = l2;
  fillSelect("filter-level3", getAvailableLevel3(l1, l2)); document.getElementById("filter-level3").disabled = false;
  document.getElementById("filter-level3").value = "";
  currentPage = 1; updateAll();
}

function setF3(l1, l2, l3) {
  filters.level1 = l1; filters.level2 = l2; filters.level3 = l3;
  document.getElementById("filter-level1").value = l1;
  fillSelect("filter-level2", getAvailableLevel2(l1)); document.getElementById("filter-level2").disabled = false; document.getElementById("filter-level2").value = l2;
  fillSelect("filter-level3", getAvailableLevel3(l1, l2)); document.getElementById("filter-level3").disabled = false; document.getElementById("filter-level3").value = l3;
  currentPage = 1; updateAll();
}

function clearFilters() {
  filters = { level1: "", level2: "", level3: "" }; versionFilter = "";
  level1Data = level1DataOrig; level2Data = level2DataOrig; level3Data = level3DataOrig;
  fillSelect("filter-level1", Object.keys(level1Data).sort());
  document.getElementById("filter-level1").value = "";
  const s2 = document.getElementById("filter-level2"); s2.disabled = true; s2.innerHTML = '<option value="">全部</option>';
  const s3 = document.getElementById("filter-level3"); s3.disabled = true; s3.innerHTML = '<option value="">全部</option>';
  document.getElementById("filter-version").value = "";
  currentPage = 1; updateAll();
}

// ─── breadcrumb ───
function updateBreadcrumb() {
  const el = document.getElementById("filter-path");
  const l1 = document.getElementById("filter-level1").value || filters.level1;
  const l2 = document.getElementById("filter-level2").value || filters.level2;
  const l3 = document.getElementById("filter-level3").value || filters.level3;
  if (!l1 && !l2 && !l3 && !versionFilter) { el.textContent = ""; return; }
  // Clear and rebuild using DOM API (avoids innerHTML parsing issues)
  el.textContent = "";
  function addSeg(text, cls, clickFn) {
    if (cls) {
      const s = document.createElement("span");
      s.className = cls; s.textContent = text;
      if (clickFn) s.onclick = clickFn;
      el.appendChild(s);
    } else {
      el.appendChild(document.createTextNode(text));
    }
  }
  addSeg("全部", "p", clearFilters);
  if (l1) { addSeg(" › ", "sep"); addSeg(l1, "p", () => clearLevel(1)); }
  if (l2) { addSeg(" › ", "sep"); addSeg(l2, "p", () => clearLevel(2)); }
  if (l3) { addSeg(" › ", "sep"); addSeg(l3, "p", () => clearLevel(3)); }
  if (versionFilter) { addSeg(" › ", "sep"); addSeg("版本:" + (versionFilter === "__empty__" ? "无版本号" : versionFilter), "p", clearVersion); }
}

function clearLevel(n) {
  if (n === 1) { filters.level2 = ""; filters.level3 = ""; fillSelect("filter-level2", getAvailableLevel2(filters.level1)); document.getElementById("filter-level2").disabled = !filters.level1; document.getElementById("filter-level2").value = ""; document.getElementById("filter-level3").disabled = true; document.getElementById("filter-level3").innerHTML = '<option value="">全部</option>'; }
  else if (n === 2) { filters.level3 = ""; fillSelect("filter-level3", getAvailableLevel3(filters.level1, filters.level2)); document.getElementById("filter-level3").disabled = !filters.level2; document.getElementById("filter-level3").value = ""; }
  currentPage = 1; updateAll();
}

function clearVersion() {
  versionFilter = ""; document.getElementById("filter-version").value = "";
  level1Data = level1DataOrig; level2Data = level2DataOrig; level3Data = level3DataOrig;
  // Re-fill level1 dropdown from original data
  fillSelect("filter-level1", Object.keys(level1Data).sort());
  if (filters.level1) {
    document.getElementById("filter-level1").value = filters.level1;
    fillSelect("filter-level2", getAvailableLevel2(filters.level1));
    if (filters.level2) {
      document.getElementById("filter-level2").value = filters.level2;
      fillSelect("filter-level3", getAvailableLevel3(filters.level1, filters.level2));
    }
  }
  currentPage = 1; updateAll();
}

// ─── charts ───
function getCurrentData() {
  if (filters.level1 && filters.level2 && filters.level3) {
    // 三级已选中：只展示当前选中的三级分类数据
    const sub = level3Data[filters.level1] && level3Data[filters.level1][filters.level2];
    const item = sub && sub[filters.level3];
    if (item) return { [filters.level3]: item };
    return {};
  }
  if (filters.level1 && filters.level2 && level3Data[filters.level1] && level3Data[filters.level1][filters.level2]) {
    return level3Data[filters.level1][filters.level2];
  }
  if (filters.level1 && level2Data[filters.level1]) {
    return level2Data[filters.level1];
  }
  return level1Data;
}

function updateCharts() {
  const data = getCurrentData();
  const labels = Object.keys(data);

  // title
  let title;
  if (filters.level1 && filters.level2 && filters.level3) title = filters.level1 + " › " + filters.level2 + " › " + filters.level3;
  else if (filters.level1 && filters.level2) title = filters.level1 + " › " + filters.level2;
  else if (filters.level1) title = filters.level1;
  else title = "全部";
  document.getElementById("charts-title").textContent = "📋 " + title;
  document.getElementById("tbl-title").textContent = "📋 " + title.replace("对比", "明细");

  // short labels for charts
  const barLabels = labels.map(l => l.length > 10 ? l.slice(0, 10) + '…' : l);

  // grouped bar / delta bar
  if (charts.bar) charts.bar.destroy();
  const barCtx = document.getElementById("barChart").getContext("2d");

  let valsA, valsB;
  if (viewMode === "count") { valsA = labels.map(l => data[l].a); valsB = labels.map(l => data[l].b); }
  else if (viewMode === "pct") { valsA = labels.map(l => data[l].pct_a); valsB = labels.map(l => data[l].pct_b); }
  else { valsA = labels.map(l => data[l].delta); valsB = null; }

  // Determine drill-down action on chart click
  const onClickHandler = (_, els) => {
    if (!els.length) return;
    const v = labels[els[0].index];
    if (filters.level1 && filters.level2) {
      setF3(filters.level1, filters.level2, v);
    } else if (filters.level1) {
      setF2(filters.level1, v);
    } else setF1(v);
  };

  if (viewMode === "delta") {
    charts.bar = new Chart(barCtx, {
      type: "bar",
      data: { labels: barLabels, datasets: [
        { label: "变化量", data: valsA, backgroundColor: labels.map(l => data[l].delta >= 0 ? COLOR_POS : COLOR_NEG), borderRadius: 4 }
      ] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { title: items => labels[items[0].dataIndex], label: ctx => "变化量: " + (ctx.raw >= 0 ? "+" : "") + ctx.raw } }
        },
        scales: { y: { grid: { color: "#f0f0f0" } }, x: { grid: { display: false } } },
        onClick: onClickHandler
      }
    });
  } else {
    charts.bar = new Chart(barCtx, {
      type: "bar",
      data: { labels: barLabels, datasets: [
        { label: LABEL_A, data: valsA, backgroundColor: COLORS_A, borderRadius: 4 },
        { label: LABEL_B, data: valsB, backgroundColor: COLORS_B, borderRadius: 4 }
      ] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "top", labels: { usePointStyle: true, font: { size: 11 } } },
          tooltip: { callbacks: {
            title: items => labels[items[0].dataIndex],
            afterBody: items => { const d = data[labels[items[0].dataIndex]]; return "变化量: " + (d.delta > 0 ? "+" : "") + d.delta + "\n占比变化: " + (d.delta_pct > 0 ? "+" : "") + d.delta_pct + "%"; }
          }}
        },
        scales: {
          y: { beginAtZero: true, grid: { color: "#f0f0f0" }, ticks: { callback: v => viewMode === "pct" ? v + "%" : v } },
          x: { grid: { display: false } }
        },
        onClick: onClickHandler
      }
    });
  }

  // delta chart
  if (charts.delta) charts.delta.destroy();
  const deltaCtx = document.getElementById("deltaChart").getContext("2d");
  const deltas = labels.map(l => data[l].delta_pct || data[l].delta);
  const unit = viewMode === "pct" ? "%" : "";
  charts.delta = new Chart(deltaCtx, {
    type: "bar",
    data: { labels: barLabels, datasets: [
      { label: "增加", data: deltas.map(d => d > 0 ? d : 0), backgroundColor: COLOR_POS, borderRadius: 4 },
      { label: "减少", data: deltas.map(d => d < 0 ? d : 0), backgroundColor: COLOR_NEG, borderRadius: 4 }
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "top", labels: { usePointStyle: true, font: { size: 11 } } },
        tooltip: { callbacks: { title: items => labels[items[0].dataIndex], label: ctx => ctx.dataset.label + ": " + (ctx.raw > 0 ? "+" : "") + ctx.raw + unit } }
      },
      scales: { y: { grid: { color: "#f0f0f0" }, ticks: { callback: v => v + unit } }, x: { grid: { display: false } } },
      onClick: onClickHandler
    }
  });
}

// ─── table ───
function getTableData() {
  const data = getCurrentData();
  const keys = Object.keys(data);
  return keys.map(k => ({
    name: k,
    a: data[k].a, pct_a: data[k].pct_a,
    b: data[k].b, pct_b: data[k].pct_b,
    delta: data[k].delta, delta_pct: data[k].delta_pct,
  })).sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta) || Math.abs(y.delta_pct) - Math.abs(x.delta_pct));
}

function isDrillable(name) {
  if (!filters.level1) return level2Data[name] && Object.keys(level2Data[name]).length > 0;
  if (filters.level1 && !filters.level2) return level3Data[filters.level1] && level3Data[filters.level1][name] && Object.keys(level3Data[filters.level1][name]).length > 0;
  return false;
}

function updateTable() {
  const tableData = getTableData();
  document.getElementById("table-count").textContent = tableData.length + " 项";
  const totalPages = Math.ceil(tableData.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  const start = (currentPage - 1) * pageSize;
  const pageData = tableData.slice(start, start + pageSize);
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";
  pageData.forEach(item => {
    const row = document.createElement("tr");
    const drillable = isDrillable(item.name);
    if (drillable) row.classList.add("drillable");
    const deltaCls = item.delta > 0 ? "delta-pos" : item.delta < 0 ? "delta-neg" : "delta-zero";
    const deltaStr = item.delta === 0 ? "0" : (item.delta > 0 ? "+" + item.delta : item.delta);
    const deltaPctCls = item.delta_pct > 0 ? "delta-pos" : item.delta_pct < 0 ? "delta-neg" : "delta-zero";
    const deltaPctStr = item.delta_pct === 0 ? "0%" : (item.delta_pct > 0 ? "+" + item.delta_pct + "%" : item.delta_pct + "%");
    const nameHtml = drillable ? '<span style="cursor:pointer;color:var(--primary)">' + item.name + ' ▸</span>' : item.name;
    row.innerHTML = "<td>" + nameHtml + "</td>" +
      "<td><span class='val-a'>" + item.a + "</span></td>" +
      "<td>" + item.pct_a + "%</td>" +
      "<td><span class='val-b'>" + item.b + "</span></td>" +
      "<td>" + item.pct_b + "%</td>" +
      "<td><span class='" + deltaCls + "'>" + deltaStr + "</span></td>" +
      "<td><span class='" + deltaPctCls + "'>" + deltaPctStr + "</span></td>";
    if (drillable) {
      row.addEventListener("click", () => {
        if (!filters.level1) setF1(item.name);
        else if (filters.level1 && !filters.level2) setF2(filters.level1, item.name);
        else if (filters.level1 && filters.level2) setF3(filters.level1, filters.level2, item.name);
      });
    }
    tbody.appendChild(row);
  });
  updatePagination(tableData.length, totalPages);
}

function updatePagination(total, totalPages) {
  const pgn = document.getElementById("pagination");
  if (totalPages <= 1) { pgn.innerHTML = ""; return; }
  let h = '<button onclick="goPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>首</button>';
  h += '<button onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';
  const start = Math.max(1, currentPage - 2), end = Math.min(totalPages, currentPage + 2);
  for (let p = start; p <= end; p++) h += '<button onclick="goPage(' + p + ')" class="' + (p === currentPage ? 'act' : '') + '">' + p + '</button>';
  h += '<button onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
  h += '<span class="info">' + currentPage + '/' + totalPages + '</span>';
  pgn.innerHTML = h;
}

function goPage(p) { currentPage = p; updateTable(); }

function updateAll() { updateCharts(); updateBreadcrumb(); updateTable(); }

// ─── 域切换 ───
function renderDomainTabs() {
  const el = document.getElementById("domain-tabs");
  if (!el) return;
  const tabs = [["function", "功能域"], ["business", "业务域"]];
  const available = tabs.filter(([d]) => dataByDomain[d]);
  if (available.length === 0) return;
  el.style.display = "flex";
  el.innerHTML = available.map(([d, label]) =>
    `<div class="domain-tab${d === activeDomain ? ' active' : ''}" data-domain="${d}" onclick="switchDomain('${d}')">${label}</div>`
  ).join("");
}

function applyDomain(d) {
  if (!dataByDomain[d]) return;
  activeDomain = d;
  const b = dataByDomain[d] || {};
  summaryData = b.summary || {};
  level1DataOrig = b.level1 || {};
  level2DataOrig = b.level2 || {};
  level3DataOrig = b.level3 || {};
  detailsA = b.detailsA || [];
  detailsB = b.detailsB || [];
  allVersions = b.versions || [];
  // 重置筛选与图表
  filters = { level1: "", level2: "", level3: "" };
  versionFilter = ""; currentPage = 1;
  if (charts.bar) { try { charts.bar.destroy(); charts.delta.destroy(); } catch (e) {} }
  charts = {};
  level1Data = level1DataOrig; level2Data = level2DataOrig; level3Data = level3DataOrig;
  // 重置下拉
  fillSelect("filter-level1", Object.keys(level1Data).sort());
  const s2 = document.getElementById("filter-level2"); s2.disabled = true; s2.innerHTML = '<option value="">全部</option>';
  const s3 = document.getElementById("filter-level3"); s3.disabled = true; s3.innerHTML = '<option value="">全部</option>';
  fillSelect("filter-version", allVersions);
  document.getElementById("filter-version").disabled = allVersions.length === 0;
  document.getElementById("filter-version").value = "";
  document.getElementById("filter-path").innerHTML = "";
  renderSummary();
  updateAll();
  document.querySelectorAll('.domain-tab').forEach(t => t.classList.toggle('active', t.dataset.domain === d));
}

function switchDomain(d) { if (d === activeDomain || !dataByDomain[d]) return; applyDomain(d); }

// ─── init ───
renderDomainTabs();
applyDomain(activeDomain);
</script>
</body>
